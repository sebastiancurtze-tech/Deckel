function panelHTML(){
  const r=R(); const close=`<button class="btn small" data-act="panel" data-v="">Schließen</button>`;
  const wrap=(title,body,back)=>`<div class="overlay" role="dialog" aria-label="${esc(title)}" data-act="panel" data-v="" data-self="1"><div class="card stats">
    <div class="top">${back?`<button class="back" data-act="panel" data-v="menu" aria-label="Zurück zum Menü">←</button>`:''}<h2 style="font-size:22px;flex:1">${esc(title)}</h2>${close}</div>${body}</div></div>`;
  if(panel==='menu') return wrap('Menü',`<div class="menu">
      <button class="mitem" data-act="panel" data-v="table"><b>Tisch-Anzeige</b><span class="muted small">großer Punktestand für alle am Tisch</span></button>
      <button class="mitem" data-act="panel" data-v="stats"><b>Statistik</b><span class="muted small">Würfel und Spieler</span></button>
      ${isBlock(r)?`<button class="mitem" data-act="panel" data-v="block"><b>Spielblock</b><span class="muted small">alle Felder aller Spieler</span></button>`:''}
      <button class="mitem" data-act="panel" data-v="log"><b>Ganzer Verlauf</b><span class="muted small">${G.log.length} Einträge</span></button>
      <button class="mitem" data-act="panel" data-v="rules"><b>Anleitung & Regeln</b><span class="muted small">${esc(r.name)}</span></button>
      <button class="mitem" data-act="panel" data-v="colors"><b>Würfelfarbe</b><span class="muted small">${esc((DICE[prefs.dice]||DICE.weiss).n)}</span></button>
      <button class="mitem" data-act="panel" data-v="leave"><b>Spiel verlassen</b><span class="muted small">zurück zum Start</span></button>
    </div>`);
  if(panel==='rules') return wrap(r.name,`${guideHTML(r)}${guideOf(r)?'<div class="label" style="margin-top:6px">Alle Regeln</div>':''}<ul class="rules">${rulesList(r).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`,1);
  if(panel==='colors') return wrap('Würfelfarbe',swatchesHTML(),1);
  if(panel==='log') return wrap('Verlauf',`<ol class="log">${G.log.map(l=>`<li><span class="num">${l.n}</span><span>${l.t}</span></li>`).join('')}</ol>`,1);
  if(panel==='leave') return wrap('Spiel verlassen',`<p style="margin:0">${G.code?'Das Spiel läuft auf den anderen Handys weiter. Du kannst mit dem Code '+G.code+' wieder beitreten.':'Der Spielstand geht dabei verloren.'}</p>
    <div class="row"><button class="btn" data-act="panel" data-v="menu">Abbrechen</button><button class="btn red" data-act="leave">Verlassen</button></div>`,1);
  return '';
}
function renderOverlay(){
  const ov=$('#ov');
  if(G&&!G.winner&&isBluff(R())&&G.code&&!myPid()){ ov.innerHTML=whoamiHTML(); return; }
  if(G&&panel==='table'){ ov.innerHTML=tableHTML(); return; }
  if(G&&panel){ ov.innerHTML=panelHTML(); return; }
  if(G&&showBlock){ ov.innerHTML=blockSheetHTML(); return; }
  if(G&&showStats){ ov.innerHTML=statsHTML(); return; }
  if(!G||!G.winner){ov.innerHTML='';return;}
  const w=G.players.find(p=>p.id===G.winner);
  const order=rankOrder(R());
  ov.innerHTML=`<div class="overlay" role="dialog" aria-label="Spielende"><div class="card">
    <div class="label">${isRound(R())?'Verloren – die nächste Runde geht auf':'Gewonnen'}</div><div class="crown">${esc(w.name)}</div>
    ${isRound(R())?`<p class="muted" style="margin:0">Hälften verloren: ${(G.halfLosers||[]).map(id=>esc((G.players.find(p=>p.id===id)||{}).name||'')).join(', ')}</p>`
      :`<ol class="log">${order.map((p,i)=>`<li><span class="num">${i+1}.</span><span style="flex:1">${esc(p.name)}</span><b class="num" style="font-size:18px">${scoreLabel(R(),p)}</b></li>`).join('')}</ol>`}
    <div class="row"><button class="btn" data-act="undo">Rückgängig</button>${isBlock(R())?'<button class="btn" data-act="block">Spielblock</button>':''}<button class="btn" data-act="stats">Statistik</button></div>
    <div class="row"><button class="btn" data-act="samenew">Anderes Spiel</button><button class="btn primary" data-act="again" style="flex:2">Nochmal ${esc(R().name)}</button></div>
    <p class="muted small" style="margin:0">Beides mit denselben Spielern.</p>
  </div></div>`;
}
function statsHTML(){
  const s=ST(); const max=Math.max(1,...s.faces.slice(1)); const exp=s.dice/6;
  const top=Math.max(max,exp)*1.08;
  const pct=v=>(v/top*100).toFixed(1);
  const dice = s.dice ? `
    <div class="bars">${FACES.map(f=>`<div class="bar"><span class="v">${s.faces[f]}</span><div class="b" style="height:${pct(s.faces[f])}%"></div></div>`).join('')}
      <div class="exp" style="bottom:${pct(exp)}%"><span>fair: je ${exp.toFixed(1).replace('.',',')}</span></div></div>
    <div class="barlabels">${FACES.map(f=>dieHTML(f)).join('')}</div>
    <div class="kpis">
      <div class="kpi"><div class="num">${s.rolls}</div><small>digitale Würfe</small></div>
      <div class="kpi"><div class="num">${s.rollTrip}</div><small>mit Drilling</small></div>
      <div class="kpi"><div class="num">${s.expTrip.toFixed(1).replace('.',',')}</div><small>Drillinge erwartet</small></div>
    </div>
    <p class="muted" style="margin:0;font-size:13px">Bei fairen Würfeln liegen alle Säulen ungefähr auf der gestrichelten Linie. Je mehr Würfe, desto näher.</p>`
    : `<p class="muted" style="margin:0;font-size:14px">Noch keine digitalen Würfe. Bei echten Würfeln sieht die App nur die rausgelegten Würfel, deshalb zählt die Verteilung nur digitale Würfe.</p>`;
  const pl=G.players.map(p=>({p,...PS(p.id)}));
  const best=k=>Math.max(...pl.map(x=>x[k]));
  const cell=(x,k)=>`<td class="${['best','trip','stole'].includes(k)&&x[k]>0&&x[k]===best(k)&&pl.length>1?'hl':''}">${fmt(x[k])}</td>`;
  const quote=x=>x.turns?Math.round(x.niete/x.turns*100)+' %':'–';
  const rs=R();
  const cols=isRP(rs)?[['turns','Züge'],['trip','Rundensiege'],['niete','Drüber / leer']]:isRace(rs)?[['turns','Würfe'],['trip','Treffer']]:isBox(rs)?[['turns','Züge'],['trip','Box zu'],['best','Höchster Rest']]:isHouse(rs)?[['turns','Runden'],['trip','Rundensiege'],['best','Beste Nummer']]:isBluff(rs)?[['turns','Ansagen'],['niete','Verloren'],['trip','Bluffs durchgekommen'],['stole','Bluffer erwischt']]:isRound(rs)?[['turns','Würfe'],['trip','Schocks'],['niete','Runden verloren'],['lost','Deckel kassiert'],['burned','Hälften verloren']]:isBlock(rs)?[['turns','Züge'],['niete','Gestrichen'],['best','Bestes Feld'],['trip','Kniffel']]:[['turns','Züge'],['niete','Nieten'],['quote','Nietenquote'],['best','Bester Zug'],['trip','Drillinge'],
    ...(rs.steal?[['stole','Geklaut'],['lost','Beklaut']]:[]), ...((rs.burn||[]).length?[['burned','Verbrannt']]:[])];
  return `<div class="overlay" role="dialog" aria-label="Statistik"><div class="card stats">
    <div class="top"><h2 style="font-size:22px">Statistik</h2><button class="btn small" data-act="closestats">Schließen</button></div>
    <div class="label">Würfelverteilung</div>
    ${dice}
    <div class="label" style="margin-top:6px">Spieler</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Spieler</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead>
    <tbody>${pl.map(x=>`<tr><td>${esc(x.p.name)}</td>${cols.map(([k])=>k==='quote'?`<td>${quote(x)}</td>`:cell(x,k)).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="muted" style="margin:0;font-size:13px">Rot = Bestwert${isBluff(rs)?' bei Bluffs und Erwischt':isRound(rs)?' bei Schocks':isBlock(rs)?' bei bestem Feld und Kniffel':` bei bester Zug, Drillingen${rs.steal?' und Geklaut':''}`}. Die Statistik läuft über alle Runden dieses Spiels.</p>
    <div class="row"><button class="btn ghost small" data-act="resetstats">Statistik zurücksetzen</button></div>
  </div></div>`;
}


/* ==========================================================
   WÜRFEL FALLEN WIE IN ECHT (3D)
   Jeder Würfel ist ein CSS-3D-Würfel. Er fliegt vom unteren Rand auf den
   Tisch, überschlägt sich, prallt ab und bleibt mit der gewürfelten Zahl
   oben liegen. Mäxchen ist ausgenommen – dort sind die Würfel geheim.
   ========================================================== */
/* Seite mit Zahl v nach vorn drehen: Lage der Flächen auf dem Würfel */
const FACE_POS={1:'rotateY(0deg)',6:'rotateY(180deg)',3:'rotateY(90deg)',4:'rotateY(-90deg)',2:'rotateX(90deg)',5:'rotateX(-90deg)'};
const FACE_TO_FRONT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
function rolledValues(a,before){
  const r=R(), t=G.turn||{};
  if(isBluff(r)) return null;
  const notHeld=(arr)=>(arr||[]).filter((_,i)=>!before.held[i]);
  if(a==='roll'||a==='cont') return t.roll||null;
  if(a==='broll'||a==='rroll') return notHeld(t.roll);
  if(a==='pokroll') return notHeld(t.dice);
  if(a==='boxroll') return t.dice||null;
  if(a==='hroll') return t.die?[t.die]:null;
  if(a==='bustroll') return (G.rp&&G.turn&&t.last)?[t.last]:null;
  if(a==='shiproll') return t.last||null;
  if(a==='jroll') return G.raceLast?[G.raceLast.die]:null;
  return null;
}
function afterRoll(a,before){
  let vals=null; try{ vals=rolledValues(a,before); }catch(e){}
  if(a==='bustroll'&&!vals){ const L=(G.rp&&G.rp.last)||{}; }
  if(!vals||!vals.length||prefs.anim===false||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){ if(prefs.anim!==false){ sfx('roll'); buzz(25); } return; }
  throwDice(vals);
}
function cubeHTML(){
  return `<div class="cube">${[1,2,3,4,5,6].map(v=>`<div class="cface" style="transform:${FACE_POS[v]} translateZ(var(--half))">${PIPS[v].map(p=>`<i style="grid-area:${Math.ceil(p/3)}/${(p-1)%3+1}"></i>`).join('')}</div>`).join('')}</div>`;
}
let throwTimer=null;
function throwDice(vals){
  const layer=document.getElementById('throw'); if(!layer) return;
  clearTimeout(throwTimer); layer.innerHTML=''; layer.classList.add('on');
  const W=innerWidth, H=innerHeight, n=vals.length;
  const size=Math.round(Math.min(78, Math.max(46, W/(n+2.2))));
  layer.style.setProperty('--size',size+'px'); layer.style.setProperty('--half',(size/2)+'px');
  /* Landeplätze: locker verteilt in der Bildmitte, ohne Überlappung */
  const spots=[]; const cx=W/2, cy=H*0.46, spreadX=Math.min(W*0.36, n*size*0.75), spreadY=Math.min(H*0.14,size*1.3);
  for(let i=0;i<n;i++){ let x,y,k=0; do{ x=cx+(Math.random()*2-1)*spreadX; y=cy+(Math.random()*2-1)*spreadY; k++; } while(k<40&&spots.some(s=>Math.hypot(s[0]-x,s[1]-y)<size*1.25)); spots.push([x,y]); }
  sfx('roll'); buzz(20);
  vals.forEach((v,i)=>{
    const wrap=document.createElement('div'); wrap.className='cubewrap'; wrap.innerHTML=cubeHTML(); layer.appendChild(wrap);
    const cube=wrap.firstChild;
    const [x,y]=spots[i]; const sx=W*(0.25+Math.random()*0.5), sy=H+size*1.5;
    const z=(Math.random()*40-20);
    /* Flugbahn: von unten hoch, Aufprall, kleiner Hüpfer, Ausrollen */
    const midX=x+(sx-x)*0.25, delay=i*45, dur=900+Math.random()*250;
    wrap.animate([
      {transform:`translate(${sx-size/2}px,${sy}px) scale(1.35)`, offset:0},
      {transform:`translate(${midX-size/2}px,${y-size*2.2-size/2}px) scale(1.15)`, offset:.38},
      {transform:`translate(${x-size/2+(sx>x?6:-6)}px,${y-size/2}px) scale(1)`, offset:.62},
      {transform:`translate(${x-size/2+(sx>x?3:-3)}px,${y-size*0.35-size/2}px) scale(1.04)`, offset:.76},
      {transform:`translate(${x-size/2}px,${y-size/2}px) scale(1)`, offset:1}
    ],{duration:dur,delay,easing:'cubic-bezier(.3,.7,.4,1)',fill:'both'});
    const [fx,fy]=FACE_TO_FRONT[v]; const spinX=360*(2+Math.floor(Math.random()*2)), spinY=360*(1+Math.floor(Math.random()*2));
    const rx0=Math.random()*360, ry0=Math.random()*360;
    cube.animate([
      {transform:`rotateZ(0deg) rotateX(${rx0}deg) rotateY(${ry0}deg)`},
      {transform:`rotateZ(${z*0.5}deg) rotateX(${fx+spinX*0.55}deg) rotateY(${fy+spinY*0.6}deg)`, offset:.62},
      {transform:`rotateZ(${z}deg) rotateX(${fx+8}deg) rotateY(${fy-6}deg)`, offset:.82},
      {transform:`rotateZ(${z}deg) rotateX(${fx}deg) rotateY(${fy}deg)`}
    ],{duration:dur,delay,easing:'cubic-bezier(.25,.6,.35,1)',fill:'both'});
    /* Aufprall-Klacken */
    setTimeout(()=>{ const c=audio(); if(c&&prefs.sound!==false){ noiseBurst(c,c.currentTime,0.04,900+Math.random()*500,0.6); } },delay+dur*0.62);
    const sh=document.createElement('div'); sh.className='cubeshadow'; sh.style.left=(x-size*0.5)+'px'; sh.style.top=(y+size*0.42)+'px'; sh.style.width=size+'px'; layer.appendChild(sh);
    sh.animate([{opacity:0,transform:'scale(.4)'},{opacity:.0,transform:'scale(.5)',offset:.4},{opacity:.45,transform:'scale(1)',offset:.62},{opacity:.35,transform:'scale(.9)',offset:.76},{opacity:.45,transform:'scale(1)'}],{duration:dur,delay,fill:'both'});
  });
  const total=1150+n*45+750;
  throwTimer=setTimeout(endThrow,total);
}
function endThrow(){ const layer=document.getElementById('throw'); if(!layer) return; clearTimeout(throwTimer); layer.classList.remove('on'); setTimeout(()=>{ if(!layer.classList.contains('on')) layer.innerHTML=''; },250); }
document.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('#throw.on')) endThrow(); },true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  if(b.dataset.self && e.target!==b) return;
  const a=b.dataset.act; audio();
  const rolling=G&&view==='game'&&(ROLL_ACTS.includes(a)||(a==='cont'&&G.mode==='digital'));
  const before=rolling?{held:[...((G.turn&&G.turn.held)||[])], id:G.turn&&G.turn.rollId, raceN:(G.stats||{}).rolls}:null;
  if(rolling&&prefs.anim===false){ sfx('roll'); buzz(25); }
  if(act[a]) act[a](b.dataset.v);
  if(rolling) afterRoll(a,before);
});
document.addEventListener('input',e=>{
  if(e.target.matches('.pline input')) setup.names[+e.target.dataset.i]=e.target.value;
  if(e.target.id==='joincode') setup.joinCode=e.target.value;
  if(e.target.id==='importtxt') setup.importTxt=e.target.value;
  if(e.target.id==='tabname') setup.tabName=e.target.value;
  if(e.target.id==='restoretxt') setup.restoreTxt=e.target.value;
  if(E && e.target.matches('[data-path]')) editorInput(e.target);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='joincode') act.join();
  if(e.key==='Enter'&&e.target.matches('.pline input')) act.addp();
});

applyDice(); shakeListen();
/* Start: letztes Spiel auf diesem Gerät fortsetzen */
const saved=loadLocal();
if(saved&&saved.G&&saved.view==='game'){ G=migrate(saved.G); view='game'; }
render();
})();
</script>
