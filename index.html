<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eef0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1824" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deckel">
<meta name="description" content="Punkte zählen für eure Spieleabende – mit euren Hausregeln.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
button{touch-action:manipulation}
</style>
<title>Deckel</title>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2')}
/* Layout: one column "score pad" — scoreboard strip on top, the active turn as the big working card, log below. */
:root{
  --bg:#e9eef0; --paper:#f8fafb; --ink:#14233a; --muted:#5d6b7c; --line:#cfd8df;
  --pip:#c8322b; --pip-soft:#f6dcd9; --zone:#e4c66a; --zone-soft:#f6edcd; --ok:#2f7d4f; --ok-soft:#d8ecdf;
  --die:#ffffff; --die-edge:#c9d2da; --focus:#2b6cb0;
  --coaster:#f4ead2; --coaster-edge:#d9c79c; --coaster-ring:#c8322b; --pencil:#3b3f46;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1824; --paper:#172333; --ink:#e7edf3; --muted:#93a2b3; --line:#2a3a4e;
  --pip:#ef5a4f; --pip-soft:#3a1f22; --zone:#d9b85a; --zone-soft:#33301f; --ok:#5cc489; --ok-soft:#183427;
  --die:#eef2f5; --die-edge:#9aa8b6; --focus:#7fb2ff; --coaster:#e8dcbf; --coaster-edge:#bfa978; --coaster-ring:#c8322b; --pencil:#3b3f46; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1824; --paper:#172333; --ink:#e7edf3; --muted:#93a2b3; --line:#2a3a4e;
  --pip:#ef5a4f; --pip-soft:#3a1f22; --zone:#d9b85a; --zone-soft:#33301f; --ok:#5cc489; --ok-soft:#183427;
  --die:#eef2f5; --die-edge:#9aa8b6; --focus:#7fb2ff; --coaster:#e8dcbf; --coaster-edge:#bfa978; --coaster-ring:#c8322b; --pencil:#3b3f46; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand{min-width:0;flex:1 1 auto}
.brand h1{font-family:var(--f-num);font-weight:800;font-size:clamp(24px,7vw,30px);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .die{flex:0 0 auto}
.chip{white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink);font-family:var(--f-num);font-size:16px;letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--pip);color:#fff;border-color:var(--pip)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:7px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}

/* scoreboard */
.board{display:flex;flex-direction:column;gap:2px}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) 64px;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.prow.cur{background:var(--pip-soft)}
.prow .rank{font-family:var(--f-num);color:var(--muted);font-size:15px;text-align:center}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sc{font-family:var(--f-num);font-weight:700;font-size:26px;text-align:right;line-height:1}
.track{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.track .z{position:absolute;top:0;bottom:0;background:var(--zone);opacity:.55}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.track .burn{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--pip)}
.prow.cur .track .fill{background:var(--pip)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px;background:var(--zone-soft);color:var(--ink)}

/* turn card */
.turn{border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px}
.turnhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.turnhead h2{font-size:22px}
.big{font-family:var(--f-num);font-weight:800;font-size:52px;line-height:.9}
.stat{text-align:right}
.hint{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500}
.hint.zone{background:var(--zone-soft)}
.hint.warn{background:var(--pip-soft)}
.hint.good{background:var(--ok-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tally{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tally .num{font-size:30px;font-weight:700}

/* dice */
.dice{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;align-items:center}
.die{width:48px;height:48px;border-radius:10px;background:var(--die);border:2px solid var(--die-edge);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;position:relative;transition:transform .12s}
.die{--dface:var(--die-face,var(--die));--dedge:var(--die-edgec,var(--die-edge));--dpip:var(--die-pip,#1d2633);--dpip15:var(--die-p15,var(--pip));background:var(--dface);border-color:var(--dedge)}
.die i{width:9px;height:9px;border-radius:50%;background:var(--dpip);place-self:center}
.die.f1 i{background:var(--dpip15)}
.die.ghost{background:transparent}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;padding:5px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.sw .die{width:30px;height:30px;padding:3px;border-radius:7px;border-width:2px}
.sw .die i{width:6px;height:6px}
.saved{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden}
.pchip button{border:0;background:transparent;padding:7px 4px 7px 12px;font-weight:600;font-size:14px}
.pchip button.rm{padding:7px 10px 7px 6px;color:var(--muted);font-weight:400}
.pchip.used{opacity:.45}
button.die{padding:6px}
.die.picked{border-color:var(--pip);transform:translateY(-4px);box-shadow:0 4px 0 var(--pip)}
.die.bad{border-color:var(--zone);border-style:dashed}
.die.ghost{background:transparent;border-style:dashed;border-color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pad .die{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.empty{color:var(--muted);font-size:14px}
@keyframes rollin{from{transform:rotate(-25deg) scale(.6);opacity:.2}to{transform:none;opacity:1}}
.rolled .die{animation:rollin .28s ease-out both}
@media (prefers-reduced-motion:reduce){.rolled .die{animation:none}.die{transition:none}}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1/-1}
.actions .btn{padding:14px 10px}
.btnsub{display:block;font-weight:500;font-size:12px;opacity:.8}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.log li{display:flex;gap:8px}
.log li .num{color:var(--muted);min-width:20px}
.steal{color:var(--pip);font-weight:600}

/* setup */
.plist{display:flex;flex-direction:column;gap:8px}
.pline{display:grid;grid-template-columns:24px minmax(0,1fr) 40px;gap:8px;align-items:center}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;height:42px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.choice{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:11px}
.opt small{display:block;color:var(--muted);font-weight:400}
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:20px;z-index:20}
.overlay .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.crown{font-family:var(--f-num);font-weight:800;font-size:40px;line-height:1}
.err{color:var(--pip);font-size:14px}
.small{font-size:13px}
.cup{display:grid;place-items:center;padding:6px 0}
.cup svg{width:96px;height:88px}
.cupwrap{min-height:100px;display:grid;place-items:center}
.claimbox{display:flex;flex-direction:column;align-items:center;gap:2px}
.claimbox b{font-family:var(--f-num);font-size:44px;line-height:1}
.claims{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.claim{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 0;font-family:var(--f-num);font-size:19px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.claim small{display:block;font-family:var(--f-body);font-size:9px;font-weight:600;letter-spacing:.02em}
.claim.pasch{background:var(--zone-soft)}
.claim.top{background:var(--pip-soft);border-color:var(--pip)}
.claim:disabled{opacity:.28;cursor:not-allowed}
.claim:not(:disabled):active{transform:scale(.96)}
.lives{display:flex;gap:4px;margin-top:5px}
.lives i{width:10px;height:10px;border-radius:50%;border:2px solid var(--pip)}
.lives i.on{background:var(--pip)}
.ranks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ranks span{border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-family:var(--f-num);font-size:15px}
.btn.big{padding:16px;font-size:17px}
.topright{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.chip:empty{display:none}
.subhead{display:flex;align-items:center;gap:10px}
.subhead h1{font-family:var(--f-num);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:40px;height:40px;flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:10px;font-size:18px;display:grid;place-items:center}
.glist{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gpick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:transparent;padding:14px 14px;text-align:left;min-width:0}
.gpick b{font-size:17px}
.ginfo{border:0;border-left:1px solid var(--line);background:transparent;padding:0 16px;font-size:13px;font-weight:600;color:var(--muted)}
.gamechip{display:flex;align-items:baseline;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;text-align:left}
.gamechip b{flex:1;font-size:16px}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:28px 2px 10px}
.herodice{display:flex;gap:10px;margin-bottom:8px}
.coaster{width:124px;height:124px;margin:0 0 10px -4px;transform:rotate(-9deg);filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.herodice .die:nth-child(1){transform:rotate(-8deg)}
.herodice .die:nth-child(3){transform:rotate(7deg)}
.herotitle{font-family:var(--f-num);font-weight:800;font-size:56px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 14px;text-align:left}
.mitem b{font-size:16px}
.codein{font-family:var(--f-num);font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
textarea.ein{resize:vertical;font-family:inherit}
.sheet{display:flex;flex-direction:column;gap:4px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:10px 12px;font-weight:600;text-align:left}
.frow .num{font-size:20px;font-weight:700}
.frow:not(:disabled){border-color:var(--ink)}
.frow:not(:disabled) .num{color:var(--pip)}
.frow.zero:not(:disabled) .num{color:var(--muted);font-size:14px;font-family:var(--f-body);font-weight:500}
.frow.done{background:var(--bg);border-color:transparent;font-weight:500;opacity:1}
.frow:disabled{cursor:default}
.frow:disabled:not(.done){opacity:.6}
.sheettbl td,.sheettbl th{text-align:center}
.sheettbl tr.sum td{background:var(--bg);font-weight:600}
.sheettbl tr.total td{font-size:20px;color:var(--pip)}
.tplrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.tplrow .btn{align-self:stretch}
.ecard{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ein{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 10px;font-variant-numeric:tabular-nums}
select.ein{width:auto}
.ein:disabled{opacity:.45}
.stepper{display:flex;align-items:center;gap:14px}
.stepper .btn{width:44px;height:44px;font-size:20px;padding:0}
.stepper b{font-size:30px;min-width:20px;text-align:center}
.tog{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.tog input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--pip);flex:0 0 auto}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.g6 .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.g6 .die,.ctab .die{width:28px;height:28px;padding:3px;border-radius:6px;border-width:2px}
.g6 .die i,.ctab .die i{width:5px;height:5px}
.g6 .ein,.ctab .ein{text-align:center;padding:9px 2px;min-width:0}
.ctab{border-collapse:separate;border-spacing:4px;width:100%;min-width:330px;table-layout:fixed}
.ctab th{font-family:var(--f-num);font-size:16px;font-weight:700;color:var(--muted)}
.ctab thead th .die{margin:0 auto}
.ctab tbody th{width:34px;text-align:left}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srow .tog{flex:1 1 120px}
.zrow{display:grid;grid-template-columns:auto 1fr auto 1fr 40px;gap:8px;align-items:center}
.overlay .card.stats{max-width:520px;max-height:calc(100% - 20px);overflow-y:auto}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;position:relative;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar .b{width:100%;max-width:44px;background:var(--ink);border-radius:5px 5px 0 0;min-height:2px}
.bar.f1 .b{background:var(--pip)}
.bar .v{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.exp{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);pointer-events:none}
.exp span{position:absolute;left:0;top:-18px;font-size:11px;color:var(--muted);background:var(--paper);padding:0 4px}
.barlabels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;justify-items:center}
.barlabels .die{width:30px;height:30px;padding:3px;border-radius:7px}
.barlabels .die i{width:6px;height:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:10px}
.kpi .num{font-size:26px;font-weight:700;line-height:1}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.tblwrap{overflow-x:auto;margin:0 -4px}
.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--f-body);font-size:14px;font-weight:600}
.tbl td.hl{color:var(--pip);font-weight:700}
</style>

</head>

<div class="wrap" id="app"></div>
<div id="ov"></div>

<script>
(()=>{
const LS='kubiki-zaehler-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>typeof n==='number'?n.toLocaleString('de-DE'):n;

/* ==========================================================
   REGELSÄTZE
   Ein Regelsatz beschreibt ein Würfelspiel vom Typ
   „Punkte sammeln, weiterwürfeln oder aufhören“ als Daten.
   ---------------------------------------------------------
   dice        Anzahl Würfel
   singles     Einzelwerte {Augenzahl: Punkte}
   combos      {Anzahl Gleiche: {Augenzahl: Punkte | "win"}}
   specials    Sonderwürfe [{type:"straight", faces, pts} | {type:"pairs3", pts}]
   carryOver   Alle Würfel gepunktet → mit allen weiter
   entry       Mindestpunkte für den ersten Eintrag (0 = aus)
   target      Zielpunktzahl
   exact       Ziel muss genau getroffen werden, drüber = stehen bleiben
   burn        Punktstände, die auf 0 verbrennen
   zones       Sperrzonen [[von, bis]] – raus nur mit einem Zug auf ≥ bis
   steal       Klau beim Überholen {amount, protectZones} | null
   ========================================================== */
const FACES=[1,2,3,4,5,6];
const tbl=fn=>Object.fromEntries(FACES.map(f=>[f,fn(f)]));
const TEMPLATES={
  kubiki:{
    id:'kubiki', name:'Kubiki', tagline:'Eure Hausregeln: 5 Würfel, Ziel genau 1.000, Sperrzonen, 555 verbrennt, Klau beim Überholen.',
    dice:5,
    singles:{1:10,5:5},
    combos:{
      3:tbl(f=>f===1?100:f*10),
      4:tbl(f=>(f===1?100:f*10)*2),
      5:tbl(f=>f===1?'win':f*100)
    },
    specials:[],
    carryOver:true, forceTake:true, entry:50, target:1000, exact:true,
    burn:[555], zones:[[400,500],[600,700]],
    steal:{amount:50, protectZones:true}
  },
  zehntausend:{
    id:'zehntausend', name:'Zehntausend', tagline:'Der Klassiker: 6 Würfel, Ziel 10.000, Einstieg mit 350, Straße und drei Paare.',
    dice:6,
    singles:{1:100,5:50},
    combos:{
      3:tbl(f=>f===1?1000:f*100),
      4:tbl(f=>(f===1?1000:f*100)*2),
      5:tbl(f=>(f===1?1000:f*100)*4),
      6:tbl(f=>(f===1?1000:f*100)*8)
    },
    specials:[{type:'straight',faces:[1,2,3,4,5,6],pts:1500},{type:'pairs3',pts:1500}],
    carryOver:true, entry:350, target:10000, exact:false,
    burn:[], zones:[], steal:null
  }
};
const clone=o=>JSON.parse(JSON.stringify(o));
const R=()=>G.rules;

/* ---------- Engine ---------- */
function counts(faces){ const c=[0,0,0,0,0,0,0]; faces.forEach(f=>c[f]++); return c; }
const hasV=v=>v==='win'||typeof v==='number';
function comboKeys(r){ return Object.keys(r.combos||{}).map(Number).filter(k=>FACES.some(f=>hasV(r.combos[k][f]))).sort((a,b)=>a-b); }
function bestCombo(r,f,n){ return comboKeys(r).reverse().find(k=>k<=n&&hasV(r.combos[k][f])); }
function special(r,faces){
  const c=counts(faces);
  for(const sp of r.specials||[]){
    if(sp.type==='straight' && faces.length===sp.faces.length && sp.faces.every(f=>c[f]===1)) return sp;
    if(sp.type==='pairs3' && faces.length===6 && c.filter(n=>n===2).length===3) return sp;
  }
  return null;
}
function scoreFaces(r,faces){
  if(!faces.length) return {pts:0,ok:false,win:false};
  const sp=special(r,faces); if(sp) return {pts:sp.pts,ok:true,win:false,special:sp};
  const c=counts(faces);
  let pts=0, ok=true, win=false;
  for(const f of FACES){
    let n=c[f];
    for(let k=bestCombo(r,f,n); k; k=bestCombo(r,f,n)){
      const v=r.combos[k][f];
      if(v==='win') win=true; else pts+=v;
      n-=k;
    }
    if(n>0){ if(r.singles[f]) pts+=r.singles[f]*n; else ok=false; }
  }
  return {pts, ok, win:win&&ok};
}
function canScore(r,roll){
  const c=counts(roll);
  if(FACES.some(f=>r.singles[f]&&c[f]>0)) return true;
  if(FACES.some(f=>bestCombo(r,f,c[f]))) return true;
  for(const sp of r.specials||[]){
    if(sp.type==='straight' && sp.faces.every(f=>c[f]>0)) return true;
    if(sp.type==='pairs3' && roll.length===6 && c.filter(n=>n===2).length===3) return true;
  }
  return false;
}
function zoneOf(r,s){ return (r.zones||[]).find(([a,b])=>s>=a&&s<b)||null; }
function bankResult(G, extra){
  const r=G.rules, p=G.players[G.cur]; const old=p.score; const total=G.turn.pts+extra;
  if(r.entry && !(p.in||old>0) && total<r.entry) return {blocked:true, entry:true, old, nw:old, total};
  let nw=old+total; const z=zoneOf(r,old);
  if(z && nw<z[1]) return {blocked:true, zone:true, old, nw:old, need:z[1]-old, total};
  if(r.exact && nw>r.target) return {blocked:true, over:true, old, nw:old, total};
  let burned=false; if((r.burn||[]).includes(nw)){burned=true; nw=0;}
  const steals=[];
  if(!burned && r.steal) G.players.forEach((o,i)=>{
    if(i!==G.cur && o.score>old && o.score<nw && !(r.steal.protectZones && zoneOf(r,o.score))) steals.push(i);
  });
  return {blocked:false, old, nw, burned, steals, total, win:r.exact? nw===r.target : nw>=r.target};
}

/* ---------- Regeltext aus dem Regelsatz ---------- */
const WORD={2:'Zwei',3:'Drei',4:'Vier',5:'Fünf',6:'Sechs'};
const MULT={2:'doppelter',3:'dreifacher',4:'vierfacher',8:'achtfacher'};
function describeCount(r,k){
  const v=r.combos[k], b=r.combos[3], W=WORD[k];
  const nums=FACES.filter(f=>typeof v[f]==='number');
  const extra=FACES.filter(f=>v[f]==='win').map(f=>`${W} ${f}er = Sofortsieg`);
  let main='';
  if(nums.length+extra.length<6){
    main=nums.length?`${W} Gleiche: `+nums.map(f=>`${f}er ${fmt(v[f])}`).join(', ')+' (sonst zählen sie nicht)':'';
    return [main,...extra].filter(Boolean).join('. ');
  }
  if(k!==3 && b && nums.every(f=>typeof b[f]==='number') && nums.length){
    const m=v[nums[0]]/b[nums[0]];
    if(MULT[m] && nums.every(f=>v[f]===b[f]*m)) main=`${W} Gleiche = ${MULT[m]} Drilling`;
  }
  if(!main){
    const others=nums.filter(f=>f!==1);
    const m=others.length?v[others[0]]/others[0]:null;
    if(m && others.every(f=>v[f]===f*m)){
      main=`${W} Gleiche = Augenzahl × ${fmt(m)}`;
      if(typeof v[1]==='number') main+=`, ${W.toLowerCase()} 1er = ${fmt(v[1])}`;
    } else main=`${W} Gleiche: `+nums.map(f=>`${f}er ${fmt(v[f])}`).join(', ');
  }
  return [main,...extra].join('. ');
}
function rulesList(r){
  if(isBlock(r)) return blockRulesList(r);
  if(isRound(r)) return roundRulesList(r);
  if(isBluff(r)) return bluffRulesList(r);
  const L=[];
  const singles=Object.entries(r.singles).filter(([f,p])=>p).map(([f,p])=>`${f}er = ${fmt(p)}`).join(', ');
  L.push(`${r.dice} Würfel.${singles?' '+singles+'.':' Einzelne Würfel zählen nicht.'}`);
  const cl=comboKeys(r).map(k=>describeCount(r,k)).filter(Boolean); if(cl.length) L.push(cl.join('. ')+'.');
  (r.specials||[]).forEach(sp=>L.push(sp.type==='straight'?`Straße ${sp.faces[0]}–${sp.faces[sp.faces.length-1]} = ${fmt(sp.pts)}.`:`Drei Paare = ${fmt(sp.pts)}.`));
  L.push(`Weiterwürfeln oder aufhören. Niete = Punkte des Zugs weg.${r.carryOver?` Alle ${r.dice} gepunktet = mit ${r.dice} weiter.`:''}`);
  if(r.forceTake) L.push('Punktewürfel müssen genommen werden, wie sie fallen. Man darf keine Punkte liegen lassen.');
  if(r.entry) L.push(`Einstieg: Im ersten Zug mindestens ${fmt(r.entry)} Punkte, sonst Niete.`);
  if((r.burn||[]).length) L.push(`Genau ${r.burn.map(fmt).join(' oder ')} verbrennt auf 0.`);
  if((r.zones||[]).length) L.push(`Sperrzonen ${r.zones.map(([a,b])=>fmt(a)+'–'+fmt(b-1)).join(' und ')}: nur mit einem Zug auf ${r.zones.map(z=>fmt(z[1])).join(' bzw. ')} raus, sonst stehen bleiben.`);
  if(r.steal) L.push(`Wer einen Spieler überholt, klaut ihm ${fmt(r.steal.amount)} Punkte.${r.steal.protectZones?' Wer in einer Sperrzone steht, kann nicht beklaut werden.':''}`);
  L.push(r.exact?`Wer zuerst genau ${fmt(r.target)} erreicht, gewinnt. Wer drüber kommt, bleibt stehen.`:`Wer zuerst ${fmt(r.target)} erreicht, gewinnt.`);
  return L;
}

/* ---------- Zustand ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
function freshTurn(r){ if(r.type==='bluff') return {dice:null,blind:false,passed:false,believed:false,rollId:null}; return r.type==='block'||r.type==='round'?{pts:0,left:r.dice,sel:[],roll:null,picked:[],held:[],rolls:0,realRolls:1}:{pts:0,left:r.dice,sel:[],roll:null,picked:[]}; }
function newGame(names,tplId){
  const rules=clone(tplOf(tplId));
  const extra=rules.type==='round'?{half:1, pool:rules.deckel, halfPlayers:[], halfLosers:[], round:{maxRolls:null,results:{},order:names.map((_,i)=>i)}}:rules.type==='bluff'?{bluff:{last:null,reveal:null}}:{};
  return {v:2, rev:1, code:null, mode:rules.type==='bluff'?'digital':'real', rules, ...extra,
    players:names.map(n=>({id:uid(),name:n,score:0})), cur:0,
    turn:freshTurn(rules),
    log:[{n:1,t:esc(rules.name)+' gestartet – '+esc(names[0])+' fängt an.'}], hist:[], winner:null, stats:freshStats()};
}
function finishNew(g){ if(g.rules.type==='round'){ g.halfPlayers=g.players.map(p=>p.id); g.players.forEach(p=>p.deckel=0); } if(g.rules.type==='bluff'){ g.players.forEach(p=>{p.lives=g.rules.lives; p.pen=0;}); } return g; }
function migrate(g){ if(g && !g.rules){ g.rules=clone(TEMPLATES.kubiki); } if(g && g.rules.id==='kubiki' && g.rules.forceTake===undefined) g.rules.forceTake=true; return g; }
/* Welche Würfel eines Wurfs bringen Punkte? (für Vorauswahl bzw. Pflicht-Nehmen) */
function scoringIdx(r,roll){
  if(special(r,roll)) return roll.map((_,i)=>i);
  const c=counts(roll), take={};
  for(const f of FACES){ let n=c[f], used=0;
    for(let k=bestCombo(r,f,n); k; k=bestCombo(r,f,n)){ used+=k; n-=k; }
    if(r.singles[f]) used+=n; take[f]=used; }
  const out=[]; roll.forEach((f,i)=>{ if(take[f]>0){ out.push(i); take[f]--; } }); return out;
}
function freshStats(){return {faces:[0,0,0,0,0,0,0], dice:0, rolls:0, rollTrip:0, expTrip:0, pl:{}};}
/* Wahrscheinlichkeit für mindestens drei Gleiche bei n Würfeln (exakt durchgezählt) */
const P_TRIP=[0,1,2,3,4,5,6].map(n=>{ if(n<3) return 0; let hit=0,tot=6**n; for(let i=0;i<tot;i++){ const c=[0,0,0,0,0,0]; let x=i; for(let d=0;d<n;d++){c[x%6]++; x=Math.floor(x/6);} if(c.some(v=>v>=3)) hit++; } return hit/tot; });
function ST(){ if(!G.stats) G.stats=freshStats(); return G.stats; }
function PS(id){ const s=ST(); if(!s.pl[id]) s.pl[id]={turns:0,niete:0,best:0,trip:0,stole:0,lost:0,burned:0}; return s.pl[id]; }
function countTrips(faces){ return counts(faces).filter(n=>n>=3).length; }
function recordPick(id,faces){ PS(id).trip+=countTrips(faces); }
let showStats=false;
const DICE={
  weiss:{n:'Weiß'},
  schwarz:{n:'Schwarz',face:'#1c2230',edge:'#000',pip:'#f4f4f4',p15:'#ff6b5e'},
  rot:{n:'Rot',face:'#c8322b',edge:'#8f1f1a',pip:'#fff',p15:'#fff'},
  blau:{n:'Blau',face:'#2459a8',edge:'#163b73',pip:'#fff',p15:'#ffd25e'},
  gruen:{n:'Grün',face:'#2f7d4f',edge:'#1d5434',pip:'#fff',p15:'#ffd25e'},
  elfenbein:{n:'Elfenbein',face:'#efe4c8',edge:'#c9b78c',pip:'#3a2a12',p15:'#b2281f'},
  gold:{n:'Gold',face:'#d6a93a',edge:'#9c7618',pip:'#2a1f08',p15:'#8b1a12'}
};
const LS_PREF='kubiki-prefs-v1';
let prefs={dice:'weiss',saved:[],tpl:'kubiki',history:[]};
try{ prefs={...prefs,...JSON.parse(localStorage.getItem(LS_PREF)||'{}')}; }catch(e){}
if(!allTemplates()[prefs.tpl]) prefs.tpl='kubiki';
function savePrefs(){ try{localStorage.setItem(LS_PREF,JSON.stringify(prefs))}catch(e){} }
function applyDice(){
  const d=DICE[prefs.dice]||DICE.weiss; const r=document.documentElement.style;
  const set=(k,v)=>v?r.setProperty(k,v):r.removeProperty(k);
  set('--die-face',d.face); set('--die-edgec',d.edge); set('--die-pip',d.pip); set('--die-p15',d.p15);
}
function swatchesHTML(){ return `<div class="swatches" role="group" aria-label="Würfelfarbe">${Object.entries(DICE).map(([k,d])=>`<button class="sw" data-act="dice" data-v="${k}" aria-pressed="${prefs.dice===k}" title="${d.n}" aria-label="${d.n}">${dieHTML(5,{attrs:k==='weiss'?'style="--dface:var(--die);--dedge:var(--die-edge);--dpip:#1d2633;--dpip15:var(--pip)"':`style="--dface:${d.face};--dedge:${d.edge};--dpip:${d.pip};--dpip15:${d.p15}"`})}</button>`).join('')}</div>`; }
let G=null;           // laufendes Spiel
let view='setup';     // setup | game
let setup={step:'home', names:['Anna','Ben','Chris','Dana'], online:false, joinCode:'', err:''};
let db=null, unsub=null, synced=false, writeChain=Promise.resolve();

function loadLocal(){try{const s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({G,view}))}catch(e){}}

function snapshotForHist(){const c=JSON.parse(JSON.stringify(G)); delete c.hist; return c;}
function pushHist(){G.hist=[...(G.hist||[]).slice(-14), snapshotForHist()];}
function addLog(t){const n=(G.log[0]?.n||0)+1; G.log=[{n,t},...G.log].slice(0,40);}

function recordEnd(){
  const r=R(), w=G.players.find(p=>p.id===G.winner); if(!w) return;
  let ranking;
  if(isRound(r)) ranking=[{n:w.name,v:'verloren'}];
  else if(isBluff(r)) ranking=[...G.players].sort((a,b)=>r.lives?b.lives-a.lives:(a.pen||0)-(b.pen||0)).map(p=>({n:p.name,v:r.lives?p.lives+' Leben':(p.pen||0)+' Strafp.'}));
  else ranking=[...G.players].sort((a,b)=>b.score-a.score).map(p=>({n:p.name,v:fmt(p.score)}));
  prefs.history=[{at:Date.now(), game:r.name, loserGame:isRound(r), who:w.name, players:G.players.map(p=>p.name), ranking}, ...(prefs.history||[])].slice(0,200);
  savePrefs();
}
function commit(){
  if(G.winner && !G.endKey){ G.endKey=uid(); recordEnd(); }
  G.rev=(G.rev||0)+1; saveLocal(); render();
  if(G.code && db){
    const data=JSON.parse(JSON.stringify(G));
    writeChain=writeChain.then(()=>db.doc('games/'+G.code).set(data)).catch(e=>{
      synced=false; renderTop(); });
  }
}

/* ---------- Online ---------- */
(async()=>{
  await Promise.resolve();
  try{ db = window.claude ? await window.claude.use('db') : null; }catch(e){ db=null; }
  if(view==='setup') render();
  if(db && G && G.code) subscribe(G.code);
})();
function subscribe(code){
  if(unsub) unsub();
  unsub=db.doc('games/'+code).onSnapshot(s=>{
    synced=true;
    if(!s.exists) return;
    const d=migrate(JSON.parse(JSON.stringify(s.data())));
    if(!G || d.rev>G.rev || G.code!==code){ G=d; view='game'; saveLocal(); render(); }
    else renderTop();
  },()=>{synced=false; renderTop();});
}
async function createOnline(names,tpl){
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let code='';
  for(let tries=0;tries<5;tries++){
    code=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');
    const s=await db.doc('games/'+code).get(); if(!s.exists) break;
  }
  G=finishNew(newGame(names,tpl)); G.code=code; view='game';
  await db.doc('games/'+code).set(JSON.parse(JSON.stringify(G)));
  saveLocal(); subscribe(code); render();
}
async function joinOnline(code){
  code=code.trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){setup.err='Der Code hat 4 Buchstaben, z. B. KRBX.';render();return;}
  try{
    const s=await db.doc('games/'+code).get();
    if(!s.exists){setup.err='Kein Spiel mit dem Code '+code+' gefunden.';render();return;}
    G=migrate(JSON.parse(JSON.stringify(s.data()))); view='game'; saveLocal(); subscribe(code); render();
  }catch(e){setup.err='Verbindung fehlgeschlagen. Bitte noch einmal versuchen.';render();}
}

/* ---------- Spielzüge ---------- */
const T=()=>G.turn;
function selFaces(){ const t=T(); return G.mode==='digital' && t.roll ? t.picked.map(i=>t.roll[i]) : t.sel; }
function nextPlayer(){
  G.cur=(G.cur+1)%G.players.length;
  G.turn=freshTurn(R());
}
function winText(faces){
  const c=counts(faces); const f=FACES.find(f=>c[f]>=3&&Object.keys(R().combos).some(k=>R().combos[k][f]==='win'&&c[f]>=+k));
  return f?`${(WORD[c[f]]||c[f]).toLowerCase()} ${f}er`:'den Sofortsieg';
}
const act={
  mode(m){ if(G.mode===m) return; G.mode=m; if(isBlock(R())||isRound(R())||isBluff(R())) G.turn=freshTurn(R()); else { G.turn.sel=[]; G.turn.roll=null; G.turn.picked=[]; } commit(); },
  face(f){ const t=T(); if(t.sel.length>=t.left) return; t.sel=[...t.sel,+f].sort(); commit(); },
  unsel(i){ const t=T(); t.sel=t.sel.filter((_,k)=>k!==+i); commit(); },
  roll(){ const t=T(); t.roll=Array.from({length:t.left},()=>1+Math.floor(Math.random()*6)); t.picked=scoringIdx(R(),t.roll); t.rollId=uid();
    const s=ST(); t.roll.forEach(f=>s.faces[f]++); s.dice+=t.roll.length; s.rolls++; s.expTrip+=P_TRIP[t.roll.length]||0; if(countTrips(t.roll)) s.rollTrip++;
    commit(); },
  pick(i){ if(R().forceTake) return; const t=T(); i=+i; t.picked=t.picked.includes(i)?t.picked.filter(x=>x!==i):[...t.picked,i]; commit(); },
  cont(){
    const r=scoreFaces(R(),selFaces()); if(!r.ok) return;
    if(r.win) return act.stop();
    const t=T(); const used=selFaces().length;
    if(t.left-used===0 && !R().carryOver) return;
    pushHist();
    recordPick(G.players[G.cur].id, selFaces());
    t.pts+=r.pts; t.left-=used;
    if(t.left===0){t.left=R().dice; addLog(esc(G.players[G.cur].name)+' hat alle Würfel gepunktet – Anschluss mit '+R().dice+' Würfeln.');}
    t.sel=[]; t.roll=null; t.picked=[];
    if(G.mode==='digital') act.roll(); else commit();
  },
  stop(){
    const rs=R();
    const f=selFaces(); const r=f.length?scoreFaces(rs,f):{pts:0,ok:true}; if(!r.ok) return;
    if(r.win){ pushHist(); const p=G.players[G.cur]; const ps=PS(p.id); ps.turns++; recordPick(p.id,f);
      p.score=Math.max(p.score,rs.target); p.in=true; G.winner=p.id; addLog('<b>'+esc(p.name)+' würfelt '+winText(f)+' und gewinnt sofort!</b>'); commit(); return; }
    if(T().pts+r.pts<=0) return;
    pushHist();
    const p=G.players[G.cur]; const b=bankResult(G,r.pts);
    const ps=PS(p.id); ps.turns++; if(f.length) recordPick(p.id,f);
    if(b.blocked){ ps.niete++; } else { ps.best=Math.max(ps.best,b.total); if(b.burned) ps.burned++; }
    if(b.entry){
      addLog(esc(p.name)+' schafft den Einstieg nicht ('+fmt(b.total)+' von mindestens '+fmt(rs.entry)+') – Niete.');
    } else if(b.over){
      addLog(esc(p.name)+' würde mit '+fmt(b.total)+' Punkten über '+fmt(rs.target)+' kommen und bleibt bei '+fmt(b.old)+'.');
    } else if(b.blocked){
      addLog(esc(p.name)+' bleibt in der Sperrzone stehen ('+fmt(b.total)+' Punkte reichten nicht, '+fmt(b.need)+' nötig).');
    } else {
      p.score=b.nw; p.in=true;
      let t=esc(p.name)+' schreibt '+fmt(b.total)+' → <b>'+fmt(b.nw)+'</b>.';
      if(b.burned) t=esc(p.name)+' landet auf '+fmt(b.old+b.total)+' und <span class="steal">verbrennt auf 0</span>.';
      addLog(t);
      b.steals.forEach(i=>{
        const o=G.players[i]; const amt=rs.steal.amount; let s=Math.max(0,o.score-amt); let extra='';
        if((rs.burn||[]).includes(s)){s=0; extra=' und verbrennt auf 0'; PS(o.id).burned++;}
        { const k=Math.min(amt,o.score); ps.stole+=k; PS(o.id).lost+=k; }
        o.score=s; addLog('<span class="steal">'+esc(p.name)+' überholt '+esc(o.name)+' und klaut '+fmt(amt)+'</span> ('+esc(o.name)+': '+fmt(s)+extra+').');
      });
      if(b.win){ G.winner=p.id; addLog('<b>'+esc(p.name)+' gewinnt mit '+fmt(b.nw)+' Punkten!</b>'); }
    }

  again(){

      G.bluff={last:null,reveal:null}; G.cur=(wi+1)%G.players.length; G.turn=freshTurn(R()); addLog('Neues Spiel – '+esc(G.players[G.cur].name)+' fängt an.'); commit(); return; }
    if(isRound(R())){ const li=Math.max(0,G.players.findIndex(p=>p.id===G.winner)); G.winner=null; G.hist=[]; G.half=1; G.halfLosers=[];
      initHalf(G.players.map(p=>p.id), li); addLog('Neues Spiel – '+esc(G.players[G.cur].name)+' fängt an.'); commit(); return; }
    G.players.forEach(p=>{p.score=0; p.in=false; p.sheet={};}); G.winner=null; G.hist=[];

  stats(){ showStats=true; renderOverlay(); },

  dice(k){ if(!DICE[k]) return; prefs.dice=k; savePrefs(); applyDice(); render(); },

const STRAIGHTS={'1-5':[1,2,3,4,5],'2-6':[2,3,4,5,6],'1-6':[1,2,3,4,5,6]};

function fromRules(r,id,isCustom){
  const st=(r.specials||[]).find(s=>s.type==='straight'), pr=(r.specials||[]).find(s=>s.type==='pairs3');
  const combos={}; for(let k=3;k<=6;k++){ combos[k]={}; FACES.forEach(f=>{ const v=r.combos?.[k]?.[f]; combos[k][f]=v==='win'?'S':(typeof v==='number'?String(v):''); }); }
  return { id, isCustom, confirmDel:false,
    name:r.name, dice:r.dice,
    singles:Object.fromEntries(FACES.map(f=>[f, r.singles[f]?String(r.singles[f]):''])),
    combos,
    straight:{on:!!st, range:st?(Object.keys(STRAIGHTS).find(k=>STRAIGHTS[k].join()===st.faces.join())||'1-6'):(r.dice>=6?'1-6':'1-5'), pts:st?String(st.pts):''},
    pairs:{on:!!pr, pts:pr?String(pr.pts):''},
    carryOver:!!r.carryOver, forceTake:!!r.forceTake, entry:r.entry?String(r.entry):'', target:String(r.target), exact:!!r.exact,
    burn:(r.burn||[]).join(', '),
    zones:(r.zones||[]).map(([a,b])=>[String(a),String(b-1)]),
    steal:{on:!!r.steal, amount:r.steal?String(r.steal.amount):'50', protect:r.steal?!!r.steal.protectZones:true}
  };
}
const num=v=>{ const t=String(v??'').replace(/\./g,'').trim(); if(t==='') return null; const n=Number(t); return Number.isFinite(n)?Math.round(n):NaN; };
function compile(E){
  const errors=[];
  const r={id:E.id, name:E.name.trim()||'Eigenes Spiel', tagline:'', dice:E.dice, singles:{}, combos:{}, specials:[],
    carryOver:E.carryOver, forceTake:!!E.forceTake, entry:0, target:0, exact:E.exact, burn:[], zones:[], steal:null};
  if(!E.name.trim()) errors.push('Gib dem Spiel einen Namen.');
  FACES.forEach(f=>{ const n=num(E.singles[f]); if(Number.isNaN(n)) errors.push(`Einzelwert für die ${f} ist keine Zahl.`); else if(n) r.singles[f]=n; });
  for(let k=3;k<=E.dice;k++){
    const row={};
    FACES.forEach(f=>{ const raw=String(E.combos[k][f]||'').trim();
      if(/^s(ieg)?$/i.test(raw)) row[f]='win';
      else { const n=num(raw); if(Number.isNaN(n)) errors.push(`${WORD[k]} Gleiche, ${f}er: „${raw}“ ist keine Zahl. Erlaubt sind Zahlen oder S für Sofortsieg.`); else if(n!==null) row[f]=n; }
    });
    if(Object.keys(row).length) r.combos[k]=row;
  }
  if(E.straight.on){
    const faces=STRAIGHTS[E.straight.range]; const n=num(E.straight.pts);
    if(faces.length>E.dice) errors.push(`Die Straße ${E.straight.range} braucht ${faces.length} Würfel.`);
    else if(!n) errors.push('Gib Punkte für die Straße an.');
    else r.specials.push({type:'straight',faces,pts:n});
  }
  if(E.pairs.on){
    const n=num(E.pairs.pts);
    if(E.dice<6) errors.push('Drei Paare gehen nur mit 6 Würfeln.');
    else if(!n) errors.push('Gib Punkte für drei Paare an.');
    else r.specials.push({type:'pairs3',pts:n});
  }
  const en=num(E.entry); if(Number.isNaN(en)) errors.push('Einstieg ist keine Zahl.'); else r.entry=en||0;
  const tg=num(E.target); if(!tg||tg<1) errors.push('Gib eine Zielpunktzahl an.'); else r.target=tg;
  E.burn.split(/[,;\s]+/).filter(Boolean).forEach(x=>{ const n=num(x); if(!n||Number.isNaN(n)) errors.push(`Verbrennen: „${x}“ ist keine Zahl.`); else r.burn.push(n); });
  E.zones.forEach(([a,b],i)=>{ const A=num(a), B=num(b);
    if(A===null&&B===null) return;
    if(!A&&A!==0||!B||Number.isNaN(A)||Number.isNaN(B)||B<=A) errors.push(`Sperrzone ${i+1}: „bis“ muss größer sein als „von“.`);
    else r.zones.push([A,B+1]); });
  if(E.steal.on){ const n=num(E.steal.amount); if(!n) errors.push('Gib an, wie viele Punkte geklaut werden.'); else r.steal={amount:n, protectZones:E.steal.protect}; }
  if(!Object.keys(r.singles).length && !comboKeys(r).length && !r.specials.length) errors.push('Mindestens ein Wurf muss Punkte bringen.');
  r.tagline=`Eigenes Spiel: ${r.dice} Würfel, Ziel ${r.exact?'genau ':''}${fmt(r.target||0)}.`;
  return {rules:r, errors};
}

const isBlock=r=>r&&r.type==='block';

function fieldScore(fd,dice){
  const c=counts(dice);
  switch(fd.kind){
    case 'face': return c[fd.face]*fd.face;
    case 'kind': return c.some(n=>n>=fd.n)?(fd.pts??sum(dice)):0;
    case 'fullhouse': { const v=c.filter(n=>n>0).sort(); return v.length===2&&v[0]===2&&v[1]===3?fd.pts:0; }
    case 'straight': { let run=0,best=0; for(const f of FACES){ run=c[f]?run+1:0; best=Math.max(best,run); } return best>=fd.len?fd.pts:0; }
    case 'chance': return sum(dice);
  }
  return 0;
}
function sheetTotals(r,sheet){
  const up=sum(r.fields.filter(f=>f.sec==='upper').map(f=>sheet[f.id]||0));

  const bonus=r.bonus&&r.bonus.pts&&up>=r.bonus.threshold?r.bonus.pts:0;

}
const filled=(r,p)=>r.fields.filter(f=>p.sheet&&p.sheet[f.id]!=null).length;

  switch(f.kind){
    case 'face': return `Summe aller ${f.face}er`;
    case 'kind': return `${WORD[f.n]||f.n} Gleiche: ${f.pts!=null?fmt(f.pts)+' Punkte':'Summe aller Würfel'}`;
    case 'fullhouse': return `Drei Gleiche und zwei Gleiche: ${fmt(f.pts)} Punkte`;
    case 'straight': return `${f.len} aufeinanderfolgende Zahlen: ${fmt(f.pts)} Punkte`;
    case 'chance': return 'Summe aller Würfel';
  }
  return '';
}
function blockRulesList(r){
  const L=[`${r.dice} Würfel, bis zu ${r.rolls} ${r.rolls===1?'Wurf':'Würfe'} pro Zug. Zwischen den Würfen beliebige Würfel festhalten.`,
    'Nach dem Zug genau ein Feld eintragen. Passt nichts, wird ein Feld mit 0 gestrichen.'];
  const up=r.fields.filter(f=>f.sec==='upper'), low=r.fields.filter(f=>f.sec==='lower');
  if(up.length) L.push(`Oben: ${up.map(f=>f.name).join(', ')} – jeweils die Summe dieser Zahl.${r.bonus&&r.bonus.pts?` Bonus +${fmt(r.bonus.pts)} ab ${fmt(r.bonus.threshold)} Punkten oben.`:''}`);

let showBlock=false;
const blockActs={
  broll(){ const t=T(), r=R(); if(t.rolls>=r.rolls) return;

    const s=ST(); const fresh=nr.filter((_,i)=>!(held[i]&&prev[i])); fresh.forEach(f=>s.faces[f]++); s.dice+=fresh.length; s.rolls++;
    t.roll=nr; t.rolls++; t.rollId=uid(); if(t.rolls>=r.rolls) t.held=[]; commit(); },
  bhold(i){ const t=T(); if(!t.roll||t.rolls>=R().rolls) return; i=+i; t.held=[...(t.held||[])]; t.held[i]=!t.held[i]; commit(); },
  bpick(id){
    const r=R(), p=G.players[G.cur], d=blockDice(); if(d.length!==r.dice) return;
    p.sheet=p.sheet||{}; if(p.sheet[id]!=null) return;
    const fd=r.fields.find(f=>f.id===id); if(!fd) return;
    pushHist();
    const v=fieldScore(fd,d); const before=sheetTotals(r,p.sheet);
    p.sheet[id]=v; const after=sheetTotals(r,p.sheet); p.score=after.total;
    const ps=PS(p.id); ps.turns++; if(v===0) ps.niete++; ps.best=Math.max(ps.best,v);
    if(fd.kind==='kind'&&fd.n===r.dice&&v>0) ps.trip++;
    addLog(v?`${esc(p.name)} trägt <b>${fmt(v)}</b> bei ${esc(fd.name)} ein.`:`${esc(p.name)} streicht ${esc(fd.name)}.`);
    if(!before.bonus&&after.bonus) addLog(`<b>${esc(p.name)} holt den Bonus (+${fmt(after.bonus)}).</b>`);
    if(G.players.every(pl=>filled(r,pl)===r.fields.length)){
      const w=[...G.players].sort((a,b)=>b.score-a.score)[0]; G.winner=w.id;
      addLog(`<b>${esc(w.name)} gewinnt mit ${fmt(w.score)} Punkten!</b>`);
    } else {
      do { G.cur=(G.cur+1)%G.players.length; } while(filled(r,G.players[G.cur])===r.fields.length);

    }

  },
  block(){ showBlock=true; renderOverlay(); },
  closeblock(){ showBlock=false; renderOverlay(); }
};

function compileBlock(E){
  const errors=[]; const base=TEMPLATES.kniffel;

const SHARE_PREFIX='DECKEL-REGELN:';
let share=null; // {rules, code, busy, err, copied}
function encodeRules(r){ const o=clone(r); delete o.id; return SHARE_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function decodeRules(txt){ const s=txt.trim(); const m=s.match(/(DECKEL|KUBIKI)-REGELN:/); if(!m) return null; const i=m.index; return JSON.parse(decodeURIComponent(escape(atob(s.slice(i+m[0].length).replace(/\s+/g,''))))); }
function normalizeRules(raw){
  if(!raw||typeof raw!=='object') throw 0;
  const id='c_'+uid();
  const e=isBlock(raw)?blockFromRules(raw,id,false):isRound(raw)?roundFromRules(raw,id,false):isBluff(raw)?bluffFromRules(raw,id,false):fromRules(raw,id,false);
  e.name=String(raw.name||'Geteiltes Spiel').slice(0,40);

}

const shareActs={
  share(id){ share={rules:clone(tplOf(id||prefs.tpl))}; render(); },
  closeshare(){ share=null; render(); },
  async sharecode(){
    if(!db||!share) return; share.busy=true; share.err=''; render();
    try{
      const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let code='';
      for(let i=0;i<5;i++){ code=Array.from({length:5},()=>L[Math.floor(Math.random()*L.length)]).join(''); const s=await db.doc('rulesets/'+code).get(); if(!s.exists) break; }
      const o=clone(share.rules); delete o.id;

  },
  copyshare(){
    const ta=$('#sharetxt'); if(!ta) return;

  },
  async importrules(){

    if(!raw){ setup.importErr='Code oder Text eingeben.'; render(); return; }

  }
};
function compileAny(E){ return E.type==='block'?compileBlock(E):E.type==='round'?compileRound(E):E.type==='bluff'?compileBluff(E):compile(E); }

/* ==========================================================
   RUNDEN-VERLIERER (Schocken-Familie)
   type:"round" · dice · rolls (max. Würfe) · deckel (Stapel) · halves (2 Hälften + Finale)
   Jede Runde würfelt jeder einmal. Der Erste legt die Zahl der Würfe fest.
   Der schlechteste Wurf kassiert so viele Deckel, wie der beste Wurf wert ist.
   ========================================================== */
TEMPLATES.schocken={
  id:'schocken', type:'round', name:'Schocken', tagline:'Kneipenklassiker: 3 Würfel, 13 Deckel, der schlechteste Wurf kassiert. Zwei Hälften und Finale.',
  dice:3, rolls:3, deckel:13, halves:true, flip:true
};
const isRound=r=>r&&r.type==='round';
function rankThrow(d){
  const s=[...d].sort((a,b)=>b-a); const c=counts(d);
  if(c[1]===3) return {cat:5,sub:0,label:'Schock out',deckel:'all'};
  if(c[1]===2){ const x=s[0]; return {cat:4,sub:x,label:`Schock ${x}`,deckel:x}; }
  if(s[0]===s[1]&&s[1]===s[2]) return {cat:3,sub:s[0],label:`General (${s.join('-')})`,deckel:3};
  if(s[0]-s[1]===1&&s[1]-s[2]===1) return {cat:2,sub:s[0],label:`Straße (${[...s].reverse().join('-')})`,deckel:2};
  return {cat:1,sub:s[0]*100+s[1]*10+s[2],label:s.join(''),deckel:1};
}
/* a besser als b? weniger Würfe gewinnt Gleichstand, dann wer zuerst dran war */
function better(a,b){
  if(a.r.cat!==b.r.cat) return a.r.cat>b.r.cat;
  if(a.r.sub!==b.r.sub) return a.r.sub>b.r.sub;
  if(a.rolls!==b.rolls) return a.rolls<b.rolls;
  return a.pos<b.pos;
}
function roundActive(){ return G.players.map((p,i)=>i).filter(i=>{ const p=G.players[i]; return G.halfPlayers.includes(p.id) && (G.pool>0 || (p.deckel||0)>0); }); }
function roundOrder(starter){ const act=roundActive(); const i0=act.includes(starter)?act.indexOf(starter):0; return [...act.slice(i0),...act.slice(0,i0)]; }
function initHalf(ids,starterIdx){
  const r=R(); G.pool=r.deckel; G.halfPlayers=ids; G.players.forEach(p=>p.deckel=0);
  const st=starterIdx!=null&&ids.includes(G.players[starterIdx].id)?starterIdx:G.players.findIndex(p=>ids.includes(p.id));
  G.round={maxRolls:null, results:{}, order:roundOrder(st)}; G.cur=G.round.order[0]; G.turn=freshTurn(r);
}
function halfName(){ return G.half===3?'Finale':`${G.half}. Hälfte`; }
function roundRulesList(r){
  return [`${r.dice} Würfel, bis zu ${r.rolls} Würfe. Würfel dürfen zwischen den Würfen liegen bleiben.`,
    'Wer eine Runde anfängt, legt mit seiner Wurfzahl fest, wie oft die anderen höchstens würfeln dürfen.',
    ...(r.flip?['Zwei Sechsen dürfen in eine Eins umgedreht werden: Eine Sechs wird zur Eins und bleibt liegen, die andere wird neu gewürfelt.']:[]),
    'Rangfolge: Schock out (1-1-1) > Schock 6 bis Schock 2 (1-1-X) > General (drei Gleiche) > Straße > Rest als Zahl, z. B. 6-4-2 = 642.',
    'Gleicher Wurf: Wer weniger Würfe gebraucht hat, liegt vorn, sonst wer zuerst dran war.',
    'Der schlechteste Wurf kassiert Deckel: Schock out = alle, Schock X = X, General = 3, Straße = 2, sonst 1.',
    `Zuerst kommen die Deckel vom Stapel (${r.deckel}). Ist er leer, gibt der beste Wurf seine Deckel ab. Wer keine Deckel hat, ist für diese Hälfte raus.`,
    'Wer alle Deckel hat, verliert die Hälfte und fängt die nächste Runde an.',
    r.halves?'Zwei Hälften. Verliert derselbe Spieler beide, hat er verloren. Sonst spielen die beiden Verlierer das Finale.':'Wer die Hälfte verliert, hat das Spiel verloren.'];
}
function roundDice(){ const t=T(); return G.mode==='digital'?(t.roll||[]):t.sel; }
function roundMax(){ return G.round.maxRolls||R().rolls; }
function endHalf(loserIdx){
  const r=R(), L=G.players[loserIdx]; G.halfLosers=[...(G.halfLosers||[]),L.id]; PS(L.id).burned++;
  addLog(`<b>${esc(L.name)} verliert die ${halfName()}.</b>`);
  if(!r.halves || G.half===3 || (G.half===2 && G.halfLosers[0]===L.id)){
    G.winner=L.id; addLog(`<b>${esc(L.name)} hat das Spiel verloren.</b>`); return;
  }
  if(G.half===1){ G.half=2; initHalf(G.players.map(p=>p.id), loserIdx); addLog('2. Hälfte – '+esc(L.name)+' fängt an.'); return; }
  G.half=3; initHalf([G.halfLosers[0],G.halfLosers[1]], loserIdx); addLog('Finale: '+G.halfLosers.map(id=>esc(G.players.find(p=>p.id===id).name)).join(' gegen ')+'.');
}
function resolveRound(){
  const res=G.round.order.map((i,pos)=>{ const x=G.round.results[G.players[i].id]; return {i,pos,rolls:x.rolls,r:rankThrow(x.dice)}; });
  let best=res[0], worst=res[0];
  res.forEach(x=>{ if(better(x,best)) best=x; if(better(worst,x)) worst=x; });
  const B=G.players[best.i], W=G.players[worst.i], r=R();
  PS(W.id).niete++;
  if(best.r.deckel==='all'){
    addLog(`<span class="steal">${esc(B.name)} wirft Schock out!</span> ${esc(W.name)} kassiert alle Deckel.`);
    W.deckel=r.deckel; G.pool=0; G.players.forEach(p=>{ if(p!==W) p.deckel=0; });
    endHalf(worst.i); return;
  }

  if(G.pool>0){ n=Math.min(n,G.pool); G.pool-=n; }
  else { n=Math.min(n,B.deckel||0); B.deckel-=n; from='von '+esc(B.name); }

  addLog(`Beste: ${esc(B.name)} (${esc(best.r.label)}). ${esc(W.name)} hat den schlechtesten Wurf (${esc(worst.r.label)}) und kassiert ${n} ${n===1?'Deckel':'Deckel'} ${from}.`);

const roundActs={
  rroll(){ const t=T(), r=R(); if(t.rolls>=roundMax()) return;
    const prev=t.roll||[]; const held=t.held||[];
    const nr=Array.from({length:r.dice},(_,i)=>held[i]&&prev[i]?prev[i]:1+Math.floor(Math.random()*6));
    const s=ST(); const fresh=nr.filter((_,i)=>!(held[i]&&prev[i])); fresh.forEach(f=>s.faces[f]++); s.dice+=fresh.length; s.rolls++;
    t.roll=nr; t.rolls++; t.rollId=uid(); commit(); },
  rflip(){ const t=T(), r=R(); if(!r.flip||!t.roll||t.rolls>=roundMax()||t.flipRoll===t.rolls) return;

  rhold(i){ const t=T(); if(!t.roll||t.rolls>=roundMax()) return; i=+i; t.held=[...(t.held||[])]; t.held[i]=!t.held[i]; commit(); },
  rcount(n){ T().realRolls=+n; commit(); },

    const rk=rankThrow(d); const ps=PS(p.id); ps.turns++; if(rk.cat>=4) ps.trip++;

};

TEMPLATES.maexchen={
  id:'maexchen', type:'bluff', name:'Mäxchen', tagline:'Bluffen mit zwei Würfeln: verdeckt würfeln, ansagen, glauben oder aufdecken. Auch Mäxle oder Meiern genannt.',
  dice:2, lives:3, maexDouble:true, equalAllowed:false, blindPass:true, secondChance:false, maexBelieve:'match', hamburger:false

const isBluff=r=>r&&r.type==='bluff';
function bluffOrder(r){
  const o=[31,32,41,42,43,51,52,53,54,61,62,63,64,65,11,22,33,44,55,66,21];
  return r.hamburger?[...o.filter(v=>v!==42),42]:o;
}
const bVal=d=>{ const [a,b]=[...d].sort((x,y)=>y-x); return a*10+b; };
const bRank=(r,v)=>bluffOrder(r).indexOf(v);
function bLabel(r,v){
  if(v===21) return 'Mäxchen';

const MAX=r=>bluffOrder(r)[bluffOrder(r).length-1];
function canBeat(r,claim){ return bRank(r,claim)<bluffOrder(r).length-1 || r.equalAllowed || (claim===21&&r.maexBelieve==='match'); }
function bluffRulesList(r){
  const L=['2 Würfel unter dem Becher. Die höhere Zahl zählt als Zehner: 6 und 3 = 63.',
    `Rangfolge: 31 < 32 < 41 … < 65 < Pasch (11 bis 66) < Mäxchen (21)${r.hamburger?' < Hamburger (42)':''}.`,
    'Würfeln, verdeckt ansehen und einen Wert ansagen – ehrlich oder geblufft. Er muss höher sein als die letzte Ansage'+(r.equalAllowed?' oder gleich hoch.':'.'),
    'Der Nächste glaubt (und würfelt selbst) oder deckt auf. Ist der Wurf mindestens so hoch wie angesagt, verliert der Aufdecker, sonst der Ansager.'];
  if(r.blindPass) L.push('Wer glaubt, darf auch ohne zu würfeln einen höheren Wert ansagen und weitergeben.');
  if(r.secondChance) L.push('Nach dem Ansehen darf man einmal nachwürfeln, muss das Ergebnis dann aber unbesehen weitergeben.');
  L.push(r.maexBelieve==='accept'?'Wird Mäxchen angesagt, deckt der Nächste auf oder nimmt die Strafe direkt an.':'Wird Mäxchen angesagt, deckt der Nächste auf oder muss selbst wieder Mäxchen ansagen.');

function bluffAlive(){ return G.players.map((p,i)=>i).filter(i=>!R().lives||G.players[i].lives>0); }
function bluffNextAlive(i){ const al=bluffAlive(); for(let k=1;k<=G.players.length;k++){ const j=(i+k)%G.players.length; if(al.includes(j)) return j; } return i; }

  if(r.lives && p.lives===0){ addLog(`${esc(p.name)} scheidet aus.`); PS(p.id).burned++; }
  const al=bluffAlive();
  if(r.lives && al.length<=1){ G.winner=G.players[al[0]].id; addLog(`<b>${esc(G.players[al[0]].name)} gewinnt Mäxchen!</b>`); return; }

let peek=false, peekKey='';
function myPid(){ return G&&G.code?(prefs.me||{})[G.code]:null; }
function canActBluff(){ const me=myPid(); return !G.code || !me || me==='*' || me===G.players[G.cur].id; }
const bluffActs={
  xroll(){ const t=T(); if(t.dice&&!t.again) return; const s=ST();
    const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]; d.forEach(f=>s.faces[f]++); s.dice+=2; s.rolls++;
    t.dice=d; t.blind=false; t.rollId=uid(); peek=false; commit(); },
  xagain(){ const t=T(); if(!R().secondChance||!t.dice||t.blind) return; const s=ST();
    const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]; d.forEach(f=>s.faces[f]++); s.dice+=2; s.rolls++;
    t.dice=d; t.blind=true; peek=false; addLog(`${esc(G.players[G.cur].name)} würfelt nach und gibt unbesehen weiter.`); commit(); },
  xpeek(){ if(T().blind) return; peek=!peek; render(); },
  xbelieve(){ const r=R(), b=G.bluff; if(!b.last) return; pushHist();

  xblind(){ const r=R(), b=G.bluff, t=T(); if(!r.blindPass||!b.last||t.dice) return;

  xdoubt(){ const r=R(), b=G.bluff; if(!b.last) return; pushHist();

};

      <details><summary class="muted" style="cursor:pointer;font-size:14px">Rangfolge zum Nachschauen</summary><div class="ranks">${[...bluffOrder(r)].reverse().map(v=>`<span>${esc(bLabel(r,v))}</span>`).join('')}</div></details>`;
  } else if(!canActBluff()){
    body=`${cupHTML()}<p style="margin:0;text-align:center"><b>${esc(p.name)}</b> ist dran${b.last?` und muss ${esc(bLabel(r,b.last.claim))} von ${esc(G.players.find(x=>x.id===b.last.pid).name)} glauben oder aufdecken`:''}.</p>`;
  } else if(b.last && !t.believed && !t.dice){
    const prev=G.players.find(x=>x.id===b.last.pid);
    const maexAccept=b.last.claim===21&&r.maexBelieve==='accept';
    body=`${cupHTML()}<div class="claimbox"><span class="muted small">${esc(prev.name)} sagt</span><b>${esc(bLabel(r,b.last.claim))}</b></div>

        ${r.blindPass&&!(b.last.claim===MAX(r))&&!maexAccept?`<button class="btn wide" data-act="xblind">Glauben, ohne zu würfeln weitergeben</button>`:''}
      </div>`;
  } else if(!t.dice){
    body=`${cupHTML()}<button class="btn primary big" data-act="xroll">Würfeln</button>
      <p class="muted small" style="margin:0;text-align:center">${b.last?`Du musst mehr als ${esc(bLabel(r,b.last.claim))} ansagen.`:'Du fängst die Runde an und darfst alles ansagen.'}</p>`;
  } else {
    const show=peek&&!t.blind;
    body=`<div class="cupwrap">${show?`<div class="dice" style="justify-content:center">${t.dice.map(f=>dieHTML(f)).join('')}</div>`:cupHTML()}</div>
      ${t.blind?`<p class="muted small" style="margin:0;text-align:center">${t.passed?'Du gibst den Becher ungesehen weiter.':'Nachgewürfelt – du weißt selbst nicht, was drunter liegt.'}</p>`
        :`<div class="row"><button class="btn" data-act="xpeek">${show?'Becher zu':'Unter den Becher schauen'}</button>${r.secondChance&&!t.passed?`<button class="btn ghost" data-act="xagain">Nachwürfeln</button>`:''}</div>`}
      <div class="label">Was sagst du an?</div>
      ${claimGrid(r,b.last?b.last.claim:null)}`;
  }
  return `${gameTop(2)}
  ${bluffBoard(r)}
  <section class="card turn">
    <div class="turnhead"><div><div class="label">Am Zug</div><h2>${esc(p.name)}</h2></div></div>
    ${seg}
    ${rev}
    ${body}
  </section>
  ${gameFooter()}`;
}

function dieHTML(f,{tag='div',cls='',attrs=''}={}){

function metaOf(r){
  if(isBlock(r)) return `${r.dice} Würfel · ${r.rolls} Würfe · ${r.fields.length} Felder`;

function gameHTML(){
  if(isBlock(R())) return blockGameHTML();
  if(isRound(R())) return roundGameHTML();
  if(isBluff(R())) return bluffGameHTML();
  const rs=R(), t=T(), p=G.players[G.cur];
  const order=G.players.map((pl,i)=>({...pl,i})).sort((a,b)=>b.score-a.score);
  const rank={}; order.forEach((pl,k)=>rank[pl.i]=k+1);
  const faces=selFaces(); const sc=faces.length?scoreFaces(rs,faces):{pts:0,ok:true};

  let input='';
  if(G.mode==='real'){
    const ghosts=Math.max(0,t.left-t.sel.length);
    input=`<div><div class="label" style="margin-bottom:6px">Rausgelegte Würfel dieses Wurfs</div>
      <div class="dice">${t.sel.map((f,i)=>dieHTML(f,{tag:'button',cls:sc.ok?'':'bad',attrs:`data-act="unsel" data-v="${i}" title="Antippen zum Entfernen"`})).join('')}${'<div class="die ghost"></div>'.repeat(ghosts)}</div></div>
      <div class="pad">${FACES.map(f=>dieHTML(f,{tag:'button',attrs:`data-act="face" data-v="${f}" ${t.sel.length>=t.left?'disabled':''}`})).join('')}</div>
      <p class="muted" style="margin:0;font-size:13px">Am Tisch würfeln, dann die Würfel antippen, die rausgelegt werden. Antippen oben entfernt sie wieder.</p>`;
  } else {
    if(!t.roll){
      input=`<button class="btn primary" data-act="roll" style="padding:18px;font-size:17px">${t.left} Würfel werfen</button>`;
    } else {
      const niete=!canScore(rs,t.roll);
      input=`<div class="dice rolled" data-roll="${t.rollId||''}">${t.roll.map((f,i)=>dieHTML(f,{tag:'button',cls:(t.picked.includes(i)?'picked':'')+(t.picked.includes(i)&&!sc.ok?' bad':''),attrs:rs.forceTake?'tabindex="-1" style="cursor:default"':`data-act="pick" data-v="${i}" aria-pressed="${t.picked.includes(i)}"`})).join('')}</div>
      ${niete?`<div class="hint warn"><b>Niete!</b> Kein Würfel zählt.</div>`:`<p class="muted" style="margin:0;font-size:13px">${rs.forceTake?'Alle Punktewürfel werden genommen, wie sie fallen.':'Alle Punktewürfel sind vorausgewählt. Antippen zum Abwählen.'}</p>`}`;
    }
  }
  const selInvalid=faces.length&&!sc.ok;
  const leftRaw=t.left-faces.length;
  const canCont=faces.length>0&&sc.ok&&(leftRaw>0||rs.carryOver);
  const canStop=sc.ok&&((t.pts+sc.pts)>0||sc.win)&&!(G.mode==='digital'&&t.roll&&!faces.length&&!canScore(rs,t.roll));
  const leftAfter=leftRaw===0?rs.dice:leftRaw;

  return `
  ${gameTop(5)}

  <section class="card" style="padding:8px">
    <div class="board">${G.players.map((pl,i)=>{const zz=zoneOf(rs,pl.score);return `
      <div class="prow ${i===G.cur?'cur':''}"><span class="rank">${rank[i]}.</span>
        <div style="min-width:0"><div class="nm">${esc(pl.name)}${zz?`<span class="tag">Sperrzone</span>`:''}</div>${trackHTML(rs,pl.score)}</div>
        <span class="sc">${fmt(pl.score)}</span></div>`}).join('')}</div>
  </section>

  <section class="card turn">
    <div class="turnhead">
      <div><div class="label">Am Zug</div><h2>${esc(p.name)}</h2><div class="muted num" style="font-size:18px">Stand ${fmt(p.score)}</div></div>
      <div class="stat"><div class="label">Zug</div><div class="big num">${fmt(t.pts+(sc.ok?sc.pts:0))}</div><div class="muted" style="font-size:13px">${t.left} Würfel im Spiel</div></div>
    </div>
    <div class="seg" role="group" aria-label="Würfel">
      <button data-act="mode" data-v="real" aria-pressed="${G.mode==='real'}">Echte Würfel</button>
      <button data-act="mode" data-v="digital" aria-pressed="${G.mode==='digital'}">Digitale Würfel</button>
    </div>
    ${input}
    <div class="tally"><span class="muted">${faces.length?`Rausgelegt: ${faces.length} Würfel`:'Noch nichts rausgelegt'}</span>
      <span>${selInvalid?'<span class="err">Nicht jeder Würfel zählt</span>':`<span class="num">+${fmt(sc.pts)}</span>`}</span></div>
    <div class="actions">
      <button class="btn primary" data-act="cont" ${canCont?'':'disabled'}>Weiterwürfeln<span class="btnsub">${canCont?'mit '+leftAfter+' Würfeln':'erst Würfel rauslegen'}</span></button>
      <button class="btn" data-act="stop" ${canStop?'':'disabled'}>Aufhören<span class="btnsub">und schreiben</span></button>
      <button class="btn red wide" data-act="niete">Niete${t.pts?` – ${fmt(t.pts)} Punkte weg`:''}</button>
    </div>
  </section>

  ${gameFooter()}`;
}
function gameTop(face){
  return `<div class="top"><div class="brand">${dieHTML(face,{attrs:'style="width:34px;height:34px;padding:4px"'})}<h1>${esc(R().name)}</h1></div>

}
function gameFooter(){
  return `<section class="card">

  return '';

function renderOverlay(){

    ${dice}
    <div class="label" style="margin-top:6px">Spieler</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Spieler</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead>
    <tbody>${pl.map(x=>`<tr><td>${esc(x.p.name)}</td>${cols.map(([k])=>k==='quote'?`<td>${quote(x)}</td>`:cell(x,k)).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="muted" style="margin:0;font-size:13px">Rot = Bestwert${isBluff(rs)?' bei Bluffs und Erwischt':isRound(rs)?' bei Schocks':isBlock(rs)?' bei bestem Feld und Kniffel':` bei bester Zug, Drillingen${rs.steal?' und Geklaut':''}`}. Die Statistik läuft über alle Runden dieses Spiels.</p>
    <div class="row"><button class="btn ghost small" data-act="resetstats">Statistik zurücksetzen</button></div>
  </div></div>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  if(b.dataset.self && e.target!==b) return;
  const a=b.dataset.act; if(act[a]) act[a](b.dataset.v);
});
document.addEventListener('input',e=>{
  if(e.target.matches('.pline input')) setup.names[+e.target.dataset.i]=e.target.value;
  if(e.target.id==='joincode') setup.joinCode=e.target.value;
  if(e.target.id==='importtxt') setup.importTxt=e.target.value;
  if(E && e.target.matches('[data-path]')) editorInput(e.target);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='joincode') act.join();
  if(e.key==='Enter'&&e.target.matches('.pline input')) act.addp();
});

applyDice();
/* Start: letztes Spiel auf diesem Gerät fortsetzen */
const saved=loadLocal();
if(saved&&saved.G&&saved.view==='game'){ G=migrate(saved.G); view='game'; }
render();
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
