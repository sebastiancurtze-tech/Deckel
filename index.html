<style>

<title>Deckel</title>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2')}
/* Layout: one column "score pad" — scoreboard strip on top, the active turn as the big working card, log below. */
:root{
  --bg:#e9eef0; --paper:#f8fafb; --ink:#14233a; --muted:#5d6b7c; --line:#cfd8df;
  --pip:#c8322b; --pip-soft:#f6dcd9; --zone:#e4c66a; --zone-soft:#f6edcd; --ok:#2f7d4f; --ok-soft:#d8ecdf;
  --die:#ffffff; --die-edge:#c9d2da; --focus:#2b6cb0;
  --coaster:#f4ead2; --coaster-edge:#d9c79c; --coaster-ring:#c8322b; --pencil:#3b3f46;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1824; --paper:#172333; --ink:#e7edf3; --muted:#93a2b3; --line:#2a3a4e;
  --pip:#ef5a4f; --pip-soft:#3a1f22; --zone:#d9b85a; --zone-soft:#33301f; --ok:#5cc489; --ok-soft:#183427;
  --die:#eef2f5; --die-edge:#9aa8b6; --focus:#7fb2ff; --coaster:#e8dcbf; --coaster-edge:#bfa978; --coaster-ring:#c8322b; --pencil:#3b3f46; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1824; --paper:#172333; --ink:#e7edf3; --muted:#93a2b3; --line:#2a3a4e;
  --pip:#ef5a4f; --pip-soft:#3a1f22; --zone:#d9b85a; --zone-soft:#33301f; --ok:#5cc489; --ok-soft:#183427;
  --die:#eef2f5; --die-edge:#9aa8b6; --focus:#7fb2ff; --coaster:#e8dcbf; --coaster-edge:#bfa978; --coaster-ring:#c8322b; --pencil:#3b3f46; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand{min-width:0;flex:1 1 auto}
.brand h1{font-family:var(--f-num);font-weight:800;font-size:clamp(24px,7vw,30px);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .die{flex:0 0 auto}
.chip{white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink);font-family:var(--f-num);font-size:16px;letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--pip);color:#fff;border-color:var(--pip)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:7px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}

/* scoreboard */
.board{display:flex;flex-direction:column;gap:2px}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) 64px;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.prow.cur{background:var(--pip-soft)}
.prow .rank{font-family:var(--f-num);color:var(--muted);font-size:15px;text-align:center}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sc{font-family:var(--f-num);font-weight:700;font-size:26px;text-align:right;line-height:1}
.track{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.track .z{position:absolute;top:0;bottom:0;background:var(--zone);opacity:.55}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.track .burn{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--pip)}
.prow.cur .track .fill{background:var(--pip)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px;background:var(--zone-soft);color:var(--ink)}

/* turn card */
.turn{border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px}
.turnhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.turnhead h2{font-size:22px}
.big{font-family:var(--f-num);font-weight:800;font-size:52px;line-height:.9}
.stat{text-align:right}
.hint{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500}
.hint.zone{background:var(--zone-soft)}
.hint.warn{background:var(--pip-soft)}
.hint.good{background:var(--ok-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tally{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tally .num{font-size:30px;font-weight:700}

/* dice */
.dice{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;align-items:center}
.die{width:48px;height:48px;border-radius:10px;background:var(--die);border:2px solid var(--die-edge);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;position:relative;transition:transform .12s}
.die{--dface:var(--die-face,var(--die));--dedge:var(--die-edgec,var(--die-edge));--dpip:var(--die-pip,#1d2633);--dpip15:var(--die-p15,var(--pip));background:var(--dface);border-color:var(--dedge)}
.die i{width:9px;height:9px;border-radius:50%;background:var(--dpip);place-self:center}
.die.f1 i{background:var(--dpip15)}
.die.ghost{background:transparent}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;padding:5px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.sw .die{width:30px;height:30px;padding:3px;border-radius:7px;border-width:2px}
.sw .die i{width:6px;height:6px}
.saved{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden}
.pchip button{border:0;background:transparent;padding:7px 4px 7px 12px;font-weight:600;font-size:14px}
.pchip button.rm{padding:7px 10px 7px 6px;color:var(--muted);font-weight:400}
.pchip.used{opacity:.45}
button.die{padding:6px}
.die.picked{border-color:var(--pip);transform:translateY(-4px);box-shadow:0 4px 0 var(--pip)}
.die.bad{border-color:var(--zone);border-style:dashed}
.die.ghost{background:transparent;border-style:dashed;border-color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pad .die{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.empty{color:var(--muted);font-size:14px}
@keyframes rollin{from{transform:rotate(-25deg) scale(.6);opacity:.2}to{transform:none;opacity:1}}
.rolled .die{animation:rollin .28s ease-out both}
@media (prefers-reduced-motion:reduce){.rolled .die{animation:none}.die{transition:none}}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1/-1}
.actions .btn{padding:14px 10px}
.btnsub{display:block;font-weight:500;font-size:12px;opacity:.8}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.log li{display:flex;gap:8px}
.log li .num{color:var(--muted);min-width:20px}
.steal{color:var(--pip);font-weight:600}

/* setup */
.plist{display:flex;flex-direction:column;gap:8px}
.pline{display:grid;grid-template-columns:24px minmax(0,1fr) 40px;gap:8px;align-items:center}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;height:42px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.choice{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:11px}
.opt small{display:block;color:var(--muted);font-weight:400}
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:20px;z-index:20}
.overlay .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.crown{font-family:var(--f-num);font-weight:800;font-size:40px;line-height:1}
.err{color:var(--pip);font-size:14px}
.small{font-size:13px}
#throw{position:fixed;inset:0;z-index:38;pointer-events:none;opacity:0;transition:opacity .22s;perspective:900px;overflow:hidden}
#throw.on{opacity:1;pointer-events:auto;background:radial-gradient(ellipse at 50% 46%,rgba(20,35,58,.45),rgba(20,35,58,.78));-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.cubewrap{position:absolute;left:0;top:0;width:var(--size);height:var(--size);transform-style:preserve-3d;will-change:transform}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.cface{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16%;background:var(--die-face,#fbfbf8);border:1.5px solid var(--die-edgec,#c9d2da);border-radius:18%;backface-visibility:hidden;box-shadow:inset 0 0 calc(var(--size)*.18) rgba(0,0,0,.14)}
.cface i{width:68%;height:68%;border-radius:50%;background:var(--die-pip,#1d2633);place-self:center;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.cubeshadow{position:absolute;height:calc(var(--size)*.22);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));filter:blur(2px)}
.brand h1.long{font-size:21px}
.subhead h1.long{font-size:21px}
.guide{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.gmeta{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:10px;padding:10px 12px}
.gmeta b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px;font-size:15px}
.gsteps li::marker{font-family:var(--f-num);font-weight:700;color:var(--pip)}
.gbox{border-left:3px solid var(--ink);padding:6px 10px;font-size:14px;background:var(--bg);border-radius:0 8px 8px 0}
.gbox.tip{border-left-color:var(--ok)}
.gbox b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rulesall summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.crew{display:grid;grid-template-columns:repeat(3,1fr) 1.6fr;gap:6px}
.crewslot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:1px dashed var(--line);border-radius:10px}
.crewslot.on{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.crewslot small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.crewslot .die{width:38px;height:38px;padding:5px}
.crewslot .die i{width:7px;height:7px}
.racerow{display:flex;flex-direction:column;gap:6px;padding:6px 8px;border-radius:10px}
.racerow.cur{background:var(--pip-soft)}
.seqs{display:flex;flex-wrap:wrap;gap:4px}
.sq{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--muted)}
.sq.ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sq.next{border:2px solid var(--pip);color:var(--ink)}
#fx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40;padding:24px}
#fx .fxcard{background:var(--ink);color:var(--paper);border-radius:18px;padding:22px 26px;text-align:center;max-width:360px;transform:scale(.7) rotate(-3deg);opacity:0;transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .2s;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#fx.on .fxcard{transform:scale(1) rotate(-2deg);opacity:1}
#fx .fxtitle{font-family:var(--f-num);font-weight:800;font-size:46px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
#fx .fxsub{margin-top:8px;font-size:15px;opacity:.85}
#fx .fx-burn .fxtitle,#fx .fx-schockout .fxtitle,#fx .fx-lose .fxtitle,#fx .fx-caught .fxtitle{color:#ff7a6e}
#fx .fx-win,#fx .fx-shut,#fx .fx-kniffel{background:var(--pip);color:#fff}
#fx .fx-ach{background:var(--zone);color:#14233a}
#fx .fx-ach .fxtitle{font-size:30px}
#fx .fx-stroke{background:#f4ead2;color:#3b3f46}
#fx .fx-stroke .fxtitle{font-size:30px}
@media (prefers-reduced-motion:reduce){#fx .fxcard{transition:none;transform:none}}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:39}
.tablemode{position:fixed;inset:0;z-index:30;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tmhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-num);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.tmhead .btn{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.3)}
.tablemode{overflow-y:auto;-webkit-overflow-scrolling:touch}
.tmbtns{display:flex;gap:8px}
.tmbody{flex:1;display:flex;flex-direction:column;gap:14px;padding:14px 0 6px;min-height:0}
.tmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-content:start}
.tmplay{--bg:#0f1824;--paper:#172333;--ink:#e7edf3;--muted:#93a2b3;--line:#2a3a4e;--pip-soft:#3a1f22;--zone-soft:#33301f;--ok-soft:#183427;color:var(--ink);min-width:0}
.tmplay .card{background:var(--paper);border-color:var(--line)}
.tmplay .turn{border-color:rgba(255,255,255,.18)}
.tmplay .btn.primary{background:#e7edf3;color:#14233a;border-color:#e7edf3}
.tmplay .tmwin .crown{color:#fff}
.tmplay .die{--dface:var(--die-face,#eef2f5);--dedge:var(--die-edge,#9aa8b6)}
@media (min-width:720px) and (orientation:landscape){
  .tmbody{flex-direction:row;align-items:flex-start}
  .tmgrid{flex:1 1 50%;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tmplay{flex:1 1 50%;max-width:520px}
}
.tmcell{background:rgba(255,255,255,.07);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"r n" "s s";gap:4px 10px}
.tmcell.cur{background:var(--pip)}
.tmrank{grid-area:r;font-family:var(--f-num);font-size:22px;opacity:.6}
.tmname{grid-area:n;font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmscore{grid-area:s;font-family:var(--f-num);font-weight:800;font-size:clamp(40px,9vw,84px);line-height:1;font-variant-numeric:tabular-nums}
.tmfoot{text-align:center;font-size:18px;opacity:.85}
.pline.lot input{background:var(--pip-soft);border-color:var(--pip)}
.mitem.setrow{flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.setrow>span{display:flex;flex-direction:column;gap:2px}
.sw2{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.setrow[aria-checked="true"] .sw2{background:var(--ok)}
.setrow[aria-checked="true"] .sw2::after{left:21px}
.tabrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.tabname{display:flex;flex-direction:column;gap:4px;min-width:0}
.tabname b{font-size:17px}
.tabbtns{display:flex;gap:6px}
.tally{max-width:100%;height:auto}
.achrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.achrow:first-of-type{border-top:0}
.achs{display:flex;flex-wrap:wrap;gap:6px}
.ach{background:var(--zone-soft);border:1px solid var(--zone);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.tiles{display:grid;gap:6px}
.tile{aspect-ratio:.75;border:2px solid var(--ink);background:#f4ead2;color:#3b2a12;border-radius:6px;font-family:var(--f-num);font-weight:800;font-size:22px;padding:0}
.tile.shut{background:var(--ink);color:var(--paper);opacity:.35}
.tile.sel{background:var(--pip);color:#fff;border-color:var(--pip);transform:translateY(-3px)}
.tile:disabled{cursor:default}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px dashed var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .num{font-size:44px;font-weight:800;line-height:1}

<body>
<div class="wrap" id="app"></div>
<div id="ov"></div>
<div id="throw" aria-hidden="true"></div>
<div id="fx" aria-live="polite"></div>

<script>
(()=>{
const LS='kubiki-zaehler-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>typeof n==='number'?n.toLocaleString('de-DE'):n;

/* ==========================================================
   REGELSÄTZE
   Ein Regelsatz beschreibt ein Würfelspiel vom Typ
   „Punkte sammeln, weiterwürfeln oder aufhören“ als Daten.
   ---------------------------------------------------------
   dice        Anzahl Würfel
   singles     Einzelwerte {Augenzahl: Punkte}
   combos      {Anzahl Gleiche: {Augenzahl: Punkte | "win"}}
   specials    Sonderwürfe [{type:"straight", faces, pts} | {type:"pairs3", pts}]
   carryOver   Alle Würfel gepunktet → mit allen weiter
   entry       Mindestpunkte für den ersten Eintrag (0 = aus)
   target      Zielpunktzahl
   exact       Ziel muss genau getroffen werden, drüber = stehen bleiben
   burn        Punktstände, die auf 0 verbrennen
   zones       Sperrzonen [[von, bis]] – raus nur mit einem Zug auf ≥ bis
   steal       Klau beim Überholen {amount, protectZones} | null
   ========================================================== */
const FACES=[1,2,3,4,5,6];
const tbl=fn=>Object.fromEntries(FACES.map(f=>[f,fn(f)]));
const TEMPLATES={
  kubiki:{
    id:'kubiki', name:'Kubiki', tagline:'Eure Hausregeln: 5 Würfel, Ziel genau 1.000, Sperrzonen, 555 verbrennt, Klau beim Überholen.',
    dice:5,
    singles:{1:10,5:5},
    combos:{
      3:tbl(f=>f===1?100:f*10),
      4:tbl(f=>(f===1?100:f*10)*2),
      5:tbl(f=>f===1?'win':f*100)
    },
    specials:[],
    carryOver:true, forceTake:true, entry:50, target:1000, exact:true,
    burn:[555], zones:[[400,500],[600,700]],
    steal:{amount:50, protectZones:true}
  },
  zehntausend:{
    id:'zehntausend', name:'Zehntausend', tagline:'Der Klassiker: 6 Würfel, Ziel 10.000, Einstieg mit 350, Straße und drei Paare.',
    dice:6,
    singles:{1:100,5:50},
    combos:{
      3:tbl(f=>f===1?1000:f*100),
      4:tbl(f=>(f===1?1000:f*100)*2),
      5:tbl(f=>(f===1?1000:f*100)*4),
      6:tbl(f=>(f===1?1000:f*100)*8)
    },
    specials:[{type:'straight',faces:[1,2,3,4,5,6],pts:1500},{type:'pairs3',pts:1500}],
    carryOver:true, entry:350, target:10000, exact:false,
    burn:[], zones:[], steal:null
  }
};
const clone=o=>JSON.parse(JSON.stringify(o));
const R=()=>G.rules;

/* ---------- Engine ---------- */
function counts(faces){ const c=[0,0,0,0,0,0,0]; faces.forEach(f=>c[f]++); return c; }
const hasV=v=>v==='win'||typeof v==='number';
function comboKeys(r){ return Object.keys(r.combos||{}).map(Number).filter(k=>FACES.some(f=>hasV(r.combos[k][f]))).sort((a,b)=>a-b); }
function bestCombo(r,f,n){ return comboKeys(r).reverse().find(k=>k<=n&&hasV(r.combos[k][f])); }
function special(r,faces){
  const c=counts(faces);
  for(const sp of r.specials||[]){
    if(sp.type==='straight' && faces.length===sp.faces.length && sp.faces.every(f=>c[f]===1)) return sp;
    if(sp.type==='pairs3' && faces.length===6 && c.filter(n=>n===2).length===3) return sp;
  }
  return null;
}
function scoreFaces(r,faces){
  if(!faces.length) return {pts:0,ok:false,win:false};
  const sp=special(r,faces); if(sp) return {pts:sp.pts,ok:true,win:false,special:sp};
  const c=counts(faces);
  let pts=0, ok=true, win=false;
  for(const f of FACES){
    let n=c[f];
    for(let k=bestCombo(r,f,n); k; k=bestCombo(r,f,n)){
      const v=r.combos[k][f];
      if(v==='win') win=true; else pts+=v;
      n-=k;
    }
    if(n>0){ if(r.singles[f]) pts+=r.singles[f]*n; else ok=false; }
  }
  return {pts, ok, win:win&&ok};
}
function canScore(r,roll){
  const c=counts(roll);
  if(FACES.some(f=>r.singles[f]&&c[f]>0)) return true;
  if(FACES.some(f=>bestCombo(r,f,c[f]))) return true;
  for(const sp of r.specials||[]){
    if(sp.type==='straight' && sp.faces.every(f=>c[f]>0)) return true;
    if(sp.type==='pairs3' && roll.length===6 && c.filter(n=>n===2).length===3) return true;
  }
  return false;
}
function zoneOf(r,s){ return (r.zones||[]).find(([a,b])=>s>=a&&s<b)||null; }
function bankResult(G, extra){
  const r=G.rules, p=G.players[G.cur]; const old=p.score; const total=G.turn.pts+extra;
  if(r.entry && !(p.in||old>0) && total<r.entry) return {blocked:true, entry:true, old, nw:old, total};
  let nw=old+total; const z=zoneOf(r,old);
  if(z && nw<z[1]) return {blocked:true, zone:true, old, nw:old, need:z[1]-old, total};
  if(r.exact && nw>r.target) return {blocked:true, over:true, old, nw:old, total};
  let burned=false; if((r.burn||[]).includes(nw)){burned=true; nw=0;}
  const steals=[];
  if(!burned && r.steal) G.players.forEach((o,i)=>{
    if(i!==G.cur && o.score>old && o.score<nw && !(r.steal.protectZones && zoneOf(r,o.score))) steals.push(i);
  });
  return {blocked:false, old, nw, burned, steals, total, win:r.exact? nw===r.target : nw>=r.target};
}

/* ---------- Regeltext aus dem Regelsatz ---------- */
const WORD={2:'Zwei',3:'Drei',4:'Vier',5:'Fünf',6:'Sechs'};
const MULT={2:'doppelter',3:'dreifacher',4:'vierfacher',8:'achtfacher'};
function describeCount(r,k){
  const v=r.combos[k], b=r.combos[3], W=WORD[k];
  const nums=FACES.filter(f=>typeof v[f]==='number');
  const extra=FACES.filter(f=>v[f]==='win').map(f=>`${W} ${f}er = Sofortsieg`);
  let main='';
  if(nums.length+extra.length<6){
    main=nums.length?`${W} Gleiche: `+nums.map(f=>`${f}er ${fmt(v[f])}`).join(', ')+' (sonst zählen sie nicht)':'';
    return [main,...extra].filter(Boolean).join('. ');
  }
  if(k!==3 && b && nums.every(f=>typeof b[f]==='number') && nums.length){
    const m=v[nums[0]]/b[nums[0]];
    if(MULT[m] && nums.every(f=>v[f]===b[f]*m)) main=`${W} Gleiche = ${MULT[m]} Drilling`;
  }
  if(!main){
    const others=nums.filter(f=>f!==1);
    const m=others.length?v[others[0]]/others[0]:null;
    if(m && others.every(f=>v[f]===f*m)){
      main=`${W} Gleiche = Augenzahl × ${fmt(m)}`;
      if(typeof v[1]==='number') main+=`, ${W.toLowerCase()} 1er = ${fmt(v[1])}`;
    } else main=`${W} Gleiche: `+nums.map(f=>`${f}er ${fmt(v[f])}`).join(', ');
  }
  return [main,...extra].join('. ');
}
function rulesList(r){
  if(isBlock(r)) return blockRulesList(r);
  if(isRound(r)) return roundRulesList(r);
  if(isBluff(r)) return bluffRulesList(r);
  if(isBox(r)) return boxRulesList(r);
  if(isHouse(r)) return houseRulesList(r);
  if(isBust(r)) return bustRulesList(r);
  if(isShip(r)) return shipRulesList(r);
  if(isPoker(r)) return pokerRulesList(r);
  if(isRace(r)) return raceRulesList(r);
  const L=[];
  const singles=Object.entries(r.singles).filter(([f,p])=>p).map(([f,p])=>`${f}er = ${fmt(p)}`).join(', ');
  L.push(`${r.dice} Würfel.${singles?' '+singles+'.':' Einzelne Würfel zählen nicht.'}`);
  const cl=comboKeys(r).map(k=>describeCount(r,k)).filter(Boolean); if(cl.length) L.push(cl.join('. ')+'.');
  (r.specials||[]).forEach(sp=>L.push(sp.type==='straight'?`Straße ${sp.faces[0]}–${sp.faces[sp.faces.length-1]} = ${fmt(sp.pts)}.`:`Drei Paare = ${fmt(sp.pts)}.`));
  L.push(`Weiterwürfeln oder aufhören. Niete = Punkte des Zugs weg.${r.carryOver&&r.dice>1?` Alle ${r.dice} gepunktet = mit ${r.dice} weiter.`:''}`);
  if(r.forceTake) L.push('Punktewürfel müssen genommen werden, wie sie fallen. Man darf keine Punkte liegen lassen.');
  if(r.entry) L.push(`Einstieg: Im ersten Zug mindestens ${fmt(r.entry)} Punkte, sonst Niete.`);
  if((r.burn||[]).length) L.push(`Genau ${r.burn.map(fmt).join(' oder ')} verbrennt auf 0.`);
  if((r.zones||[]).length) L.push(`Sperrzonen ${r.zones.map(([a,b])=>fmt(a)+'–'+fmt(b-1)).join(' und ')}: nur mit einem Zug auf ${r.zones.map(z=>fmt(z[1])).join(' bzw. ')} raus, sonst stehen bleiben.`);
  if(r.steal) L.push(`Wer einen Spieler überholt, klaut ihm ${fmt(r.steal.amount)} Punkte.${r.steal.protectZones?' Wer in einer Sperrzone steht, kann nicht beklaut werden.':''}`);
  L.push(r.exact?`Wer zuerst genau ${fmt(r.target)} erreicht, gewinnt. Wer drüber kommt, bleibt stehen.`:`Wer zuerst ${fmt(r.target)} erreicht, gewinnt.`);
  return L;
}

/* ---------- Zustand ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
function freshTurn(r){ if(r.type==='bust') return {total:0,rolls:0,last:null,sel:[],rollId:null}; if(r.type==='ship') return {set:[],cargo:null,last:null,rolls:0,sel:[],left:5,rollId:null}; if(r.type==='poker') return {dice:null,held:[],rolls:0,sel:[],left:5,rollId:null}; if(r.type==='race') return {sel:[]}; if(r.type==='box') return {tiles:Array(r.tiles).fill(true),dice:null,sel:[],tsel:[],left:2,rollId:null}; if(r.type==='house') return {slots:[null,null,null],die:null,sel:[],rollId:null}; if(r.type==='bluff') return {dice:null,blind:false,passed:false,believed:false,rollId:null}; return r.type==='block'||r.type==='round'?{pts:0,left:r.dice,sel:[],roll:null,picked:[],held:[],rolls:0,realRolls:1}:{pts:0,left:r.dice,sel:[],roll:null,picked:[]}; }
function newGame(names,tplId){
  const rules=clone(tplOf(tplId));
  const extra=rules.type==='round'?{half:1, pool:rules.deckel, halfPlayers:[], halfLosers:[], round:{maxRolls:null,results:{},order:names.map((_,i)=>i)}}:rules.type==='bluff'?{bluff:{last:null,reveal:null}}:rules.type==='box'?{box:{round:1}}:rules.type==='house'?{house:{res:{},starter:0}}:['bust','ship','poker'].includes(rules.type)?{rp:{res:{},starter:0}}:rules.type==='race'?{raceLast:null}:{};
  return {v:2, rev:1, code:null, mode:rules.type==='bluff'?'digital':'real', rules, ...extra,
    players:names.map(n=>({id:uid(),name:n,score:0})), cur:0,
    turn:freshTurn(rules),
    log:[{n:1,t:esc(rules.name)+' gestartet – '+esc(names[0])+' fängt an.'}], hist:[], winner:null, stats:freshStats()};
}
function finishNew(g){ if(g.rules.type==='round'){ g.halfPlayers=g.players.map(p=>p.id); g.players.forEach(p=>p.deckel=0); } if(g.rules.type==='bluff'){ g.players.forEach(p=>{p.lives=g.rules.lives; p.pen=0;}); } if(g.rules.type==='box') g.players.forEach(p=>{p.total=0;p.score=0;}); if(g.rules.type==='house'||['bust','ship','poker'].includes(g.rules.type)) g.players.forEach(p=>{p.wins=0;p.score=0;}); if(g.rules.type==='race') g.players.forEach(p=>{p.pos=0;p.score=0;}); return g; }
function migrate(g){ if(g && !g.rules){ g.rules=clone(TEMPLATES.kubiki); } if(g && g.rules.id==='kubiki' && g.rules.forceTake===undefined) g.rules.forceTake=true; return g; }
/* Welche Würfel eines Wurfs bringen Punkte? (für Vorauswahl bzw. Pflicht-Nehmen) */
function scoringIdx(r,roll){
  if(special(r,roll)) return roll.map((_,i)=>i);
  const c=counts(roll), take={};
  for(const f of FACES){ let n=c[f], used=0;
    for(let k=bestCombo(r,f,n); k; k=bestCombo(r,f,n)){ used+=k; n-=k; }
    if(r.singles[f]) used+=n; take[f]=used; }
  const out=[]; roll.forEach((f,i)=>{ if(take[f]>0){ out.push(i); take[f]--; } }); return out;
}
function freshStats(){return {faces:[0,0,0,0,0,0,0], dice:0, rolls:0, rollTrip:0, expTrip:0, pl:{}};}
/* Wahrscheinlichkeit für mindestens drei Gleiche bei n Würfeln (exakt durchgezählt) */
const P_TRIP=[0,1,2,3,4,5,6].map(n=>{ if(n<3) return 0; let hit=0,tot=6**n; for(let i=0;i<tot;i++){ const c=[0,0,0,0,0,0]; let x=i; for(let d=0;d<n;d++){c[x%6]++; x=Math.floor(x/6);} if(c.some(v=>v>=3)) hit++; } return hit/tot; });
function ST(){ if(!G.stats) G.stats=freshStats(); return G.stats; }

async function createOnline(names,tpl){
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let code='';
  for(let tries=0;tries<5;tries++){
    code=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');
    const s=await db.doc('games/'+code).get(); if(!s.exists) break;
  }
  G=finishNew(newGame(names,tpl)); G.code=code; view='game';
  await db.doc('games/'+code).set(JSON.parse(JSON.stringify(G)));

}
async function joinOnline(code){
  code=code.trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){setup.err='Der Code hat 4 Buchstaben, z. B. KRBX.';render();return;}
  try{
    const s=await db.doc('games/'+code).get();
    if(!s.exists){setup.err='Kein Spiel mit dem Code '+code+' gefunden.';render();return;}
    G=migrate(JSON.parse(JSON.stringify(s.data()))); view='game'; saveLocal(); subscribe(code); render();
  }catch(e){setup.err='Verbindung fehlgeschlagen. Bitte noch einmal versuchen.';render();}
}

const T=()=>G.turn;

function winText(faces){
  const c=counts(faces); const f=FACES.find(f=>c[f]>=3&&Object.keys(R().combos).some(k=>R().combos[k][f]==='win'&&c[f]>=+k));
  return f?`${(WORD[c[f]]||c[f]).toLowerCase()} ${f}er`:'den Sofortsieg';
}
const act={
  mode(m){ if(G.mode===m) return; G.mode=m; if(isBust(R())||isRace(R())){ G.turn.sel=[]; } else if(isShip(R())||isPoker(R())){ G.turn=freshTurn(R()); } else if(isBox(R())){ const t=G.turn; t.dice=null; t.sel=[]; t.tsel=[]; } else if(isHouse(R())){ G.turn.die=null; } else if(isBlock(R())||isRound(R())||isBluff(R())) G.turn=freshTurn(R()); else { G.turn.sel=[]; G.turn.roll=null; G.turn.picked=[]; } commit(); },
  face(f){ const t=T(); if(t.sel.length>=t.left) return; t.sel=[...t.sel,+f].sort(); commit(); },
  unsel(i){ const t=T(); t.sel=t.sel.filter((_,k)=>k!==+i); commit(); },
  roll(){ const t=T(); t.roll=Array.from({length:t.left},()=>1+Math.floor(Math.random()*6)); t.picked=scoringIdx(R(),t.roll); t.rollId=uid();
    const s=ST(); t.roll.forEach(f=>s.faces[f]++); s.dice+=t.roll.length; s.rolls++; s.expTrip+=P_TRIP[t.roll.length]||0; if(countTrips(t.roll)) s.rollTrip++;

  pick(i){ if(R().forceTake) return; const t=T(); i=+i; t.picked=t.picked.includes(i)?t.picked.filter(x=>x!==i):[...t.picked,i]; commit(); },
  cont(){
    const r=scoreFaces(R(),selFaces()); if(!r.ok) return;
    if(r.win) return act.stop();
    const t=T(); const used=selFaces().length;
    if(t.left-used===0 && !R().carryOver) return;
    pushHist();
    recordPick(G.players[G.cur].id, selFaces());
    t.pts+=r.pts; t.left-=used;
    if(t.left===0){t.left=R().dice; addLog(esc(G.players[G.cur].name)+' hat alle Würfel gepunktet – Anschluss mit '+R().dice+' Würfeln.');}
    t.sel=[]; t.roll=null; t.picked=[];

  },

    pushHist();
    const p=G.players[G.cur]; const b=bankResult(G,r.pts);
    const ps=PS(p.id); ps.turns++; if(f.length) recordPick(p.id,f);
    if(b.blocked){ ps.niete++; } else { ps.best=Math.max(ps.best,b.total); if(b.burned) ps.burned++; }
    if(b.entry){
      addLog(esc(p.name)+' schafft den Einstieg nicht ('+fmt(b.total)+' von mindestens '+fmt(rs.entry)+') – Niete.');
    } else if(b.over){
      addLog(esc(p.name)+' würde mit '+fmt(b.total)+' Punkten über '+fmt(rs.target)+' kommen und bleibt bei '+fmt(b.old)+'.');
    } else if(b.blocked){
      addLog(esc(p.name)+' bleibt in der Sperrzone stehen ('+fmt(b.total)+' Punkte reichten nicht, '+fmt(b.need)+' nötig).');
    } else {
      p.score=b.nw; p.in=true;

      if(b.burned){ t=esc(p.name)+' landet auf '+fmt(b.old+b.total)+' und <span class="steal">verbrennt auf 0</span>.'; celebrate('burn','Verbrannt!',p.name+' landet auf '+fmt(b.old+b.total)+' und fällt auf 0'); }
      addLog(t);
      b.steals.forEach(i=>{
        const o=G.players[i]; const amt=rs.steal.amount; let s=Math.max(0,o.score-amt); let extra='';
        if((rs.burn||[]).includes(s)){s=0; extra=' und verbrennt auf 0'; PS(o.id).burned++;}
        { const k=Math.min(amt,o.score); ps.stole+=k; ps.steals=(ps.steals||0)+1; PS(o.id).lost+=k; celebrate('steal','Geklaut!',p.name+' überholt '+o.name+' und nimmt '+k); }
        o.score=s; addLog('<span class="steal">'+esc(p.name)+' überholt '+esc(o.name)+' und klaut '+fmt(amt)+'</span> ('+esc(o.name)+': '+fmt(s)+extra+').');
      });
      if(b.win){ G.winner=p.id; addLog('<b>'+esc(p.name)+' gewinnt mit '+fmt(b.nw)+' Punkten!</b>'); }

  },
  niete(){ pushHist(); const p=G.players[G.cur]; { const ps=PS(p.id); ps.turns++; ps.niete++; } addLog(esc(p.name)+' wirft eine Niete'+(T().pts?' – '+fmt(T().pts)+' Punkte weg.':'.')); nextPlayer(); commit(); },
  undo(){ const h=G.hist||[]; if(!h.length) return; const prev=h[h.length-1]; const rest=h.slice(0,-1); const rev=G.rev; if(G.endKey&&!prev.winner&&(prefs.history||[]).length){ prefs.history=prefs.history.slice(1); savePrefs(); } G={...prev,hist:rest,rev}; commit(); },
  again(){
    G.endKey=null;

      G.bluff={last:null,reveal:null}; G.cur=(wi+1)%G.players.length; G.turn=freshTurn(R()); addLog('Neues Spiel – '+esc(G.players[G.cur].name)+' fängt an.'); commit(); return; }

      initHalf(G.players.map(p=>p.id), li); addLog('Neues Spiel – '+esc(G.players[G.cur].name)+' fängt an.'); commit(); return; }
    G.players.forEach(p=>{p.score=0; p.in=false; p.sheet={};}); G.winner=null; G.hist=[];
    G.cur=(G.cur+1)%G.players.length; G.turn=freshTurn(R());
    addLog('Neue Runde – '+esc(G.players[G.cur].name)+' fängt an.'); commit(); },
  stats(){ showStats=true; renderOverlay(); },
  closestats(){ showStats=false; renderOverlay(); },
  resetstats(){ pushHist(); G.stats=freshStats(); commit(); },
  dice(k){ if(!DICE[k]) return; prefs.dice=k; savePrefs(); applyDice(); render(); },
  tpl(k){ if(!allTemplates()[k]) return; prefs.tpl=k; savePrefs(); setup.step='players'; setup.err=''; render(); window.scrollTo(0,0); },
  go(st){ setup.step=st||'home'; setup.err=''; setup.newPick=false; setup.importErr=''; setup.importMsg=''; render(); window.scrollTo(0,0); },

  panel(v){ if(v==='stats'){ panel=null; showStats=true; } else if(v==='block'){ panel=null; showBlock=true; } else panel=v||null; renderOverlay(); },
  addsaved(n){ const cur=setup.names.map(s=>s.trim()); if(cur.includes(n)) return; const i=setup.names.findIndex(s=>!s.trim()); if(i>=0) setup.names[i]=n; else setup.names=[...setup.names,n]; render(); },
  rmsaved(n){ prefs.saved=prefs.saved.filter(x=>x!==n); savePrefs(); render(); },
  clearnames(){ setup.names=['','']; render(); },

  clearhist(v){ if(v===undefined){ setup.confirmClear=true; render(); return; } if(v==='1'){ prefs.history=[]; savePrefs(); } setup.confirmClear=false; render(); },

/* ---------- Regel-Editor ---------- */
const STRAIGHTS={'1-5':[1,2,3,4,5],'2-6':[2,3,4,5,6],'1-6':[1,2,3,4,5,6]};
function allTemplates(){ return {...TEMPLATES, ...(prefs.custom||{})}; }
function tplOf(id){ return allTemplates()[id]||TEMPLATES.kubiki; }
let E=null; // Formularzustand des Editors
function fromRules(r,id,isCustom){
  const st=(r.specials||[]).find(s=>s.type==='straight'), pr=(r.specials||[]).find(s=>s.type==='pairs3');
  const combos={}; for(let k=3;k<=6;k++){ combos[k]={}; FACES.forEach(f=>{ const v=r.combos?.[k]?.[f]; combos[k][f]=v==='win'?'S':(typeof v==='number'?String(v):''); }); }
  return { id, isCustom, confirmDel:false,
    name:r.name, dice:r.dice,
    singles:Object.fromEntries(FACES.map(f=>[f, r.singles[f]?String(r.singles[f]):''])),
    combos,
    straight:{on:!!st, range:st?(Object.keys(STRAIGHTS).find(k=>STRAIGHTS[k].join()===st.faces.join())||'1-6'):(r.dice>=6?'1-6':'1-5'), pts:st?String(st.pts):''},
    pairs:{on:!!pr, pts:pr?String(pr.pts):''},
    carryOver:!!r.carryOver, forceTake:!!r.forceTake, entry:r.entry?String(r.entry):'', target:String(r.target), exact:!!r.exact,
    burn:(r.burn||[]).join(', '),
    zones:(r.zones||[]).map(([a,b])=>[String(a),String(b-1)]),
    steal:{on:!!r.steal, amount:r.steal?String(r.steal.amount):'50', protect:r.steal?!!r.steal.protectZones:true}
  };
}
const num=v=>{ const t=String(v??'').replace(/\./g,'').trim(); if(t==='') return null; const n=Number(t); return Number.isFinite(n)?Math.round(n):NaN; };
function compile(E){
  const errors=[];
  const r={id:E.id, name:E.name.trim()||'Eigenes Spiel', tagline:'', dice:E.dice, singles:{}, combos:{}, specials:[],
    carryOver:E.carryOver, forceTake:!!E.forceTake, entry:0, target:0, exact:E.exact, burn:[], zones:[], steal:null};
  if(!E.name.trim()) errors.push('Gib dem Spiel einen Namen.');
  FACES.forEach(f=>{ const n=num(E.singles[f]); if(Number.isNaN(n)) errors.push(`Einzelwert für die ${f} ist keine Zahl.`); else if(n) r.singles[f]=n; });
  for(let k=3;k<=E.dice;k++){
    const row={};
    FACES.forEach(f=>{ const raw=String(E.combos[k][f]||'').trim();
      if(/^s(ieg)?$/i.test(raw)) row[f]='win';
      else { const n=num(raw); if(Number.isNaN(n)) errors.push(`${WORD[k]} Gleiche, ${f}er: „${raw}“ ist keine Zahl. Erlaubt sind Zahlen oder S für Sofortsieg.`); else if(n!==null) row[f]=n; }
    });
    if(Object.keys(row).length) r.combos[k]=row;
  }
  if(E.straight.on){
    const faces=STRAIGHTS[E.straight.range]; const n=num(E.straight.pts);
    if(faces.length>E.dice) errors.push(`Die Straße ${E.straight.range} braucht ${faces.length} Würfel.`);
    else if(!n) errors.push('Gib Punkte für die Straße an.');
    else r.specials.push({type:'straight',faces,pts:n});
  }
  if(E.pairs.on){
    const n=num(E.pairs.pts);
    if(E.dice<6) errors.push('Drei Paare gehen nur mit 6 Würfeln.');
    else if(!n) errors.push('Gib Punkte für drei Paare an.');
    else r.specials.push({type:'pairs3',pts:n});
  }
  const en=num(E.entry); if(Number.isNaN(en)) errors.push('Einstieg ist keine Zahl.'); else r.entry=en||0;
  const tg=num(E.target); if(!tg||tg<1) errors.push('Gib eine Zielpunktzahl an.'); else r.target=tg;
  E.burn.split(/[,;\s]+/).filter(Boolean).forEach(x=>{ const n=num(x); if(!n||Number.isNaN(n)) errors.push(`Verbrennen: „${x}“ ist keine Zahl.`); else r.burn.push(n); });
  E.zones.forEach(([a,b],i)=>{ const A=num(a), B=num(b);
    if(A===null&&B===null) return;
    if(!A&&A!==0||!B||Number.isNaN(A)||Number.isNaN(B)||B<=A) errors.push(`Sperrzone ${i+1}: „bis“ muss größer sein als „von“.`);
    else r.zones.push([A,B+1]); });
  if(E.steal.on){ const n=num(E.steal.amount); if(!n) errors.push('Gib an, wie viele Punkte geklaut werden.'); else r.steal={amount:n, protectZones:E.steal.protect}; }
  if(!Object.keys(r.singles).length && !comboKeys(r).length && !r.specials.length) errors.push('Mindestens ein Wurf muss Punkte bringen.');
  r.tagline=`Eigenes Spiel: ${r.dice} Würfel, Ziel ${r.exact?'genau ':''}${fmt(r.target||0)}.`;
  return {rules:r, errors};
}
function getPath(o,p){ return p.split('.').reduce((x,k)=>x?.[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); const last=ks.pop(); const t=ks.reduce((x,k)=>x[k],o); t[last]=v; }
function editorPreview(){
  const {rules,errors}=compileAny(E);
  return `${errors.length?`<div class="hint warn"><b>Noch nicht speicherbar:</b><ul class="rules" style="margin-top:6px">${errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
    <ul class="rules">${rulesList(rules).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
}

/* ==========================================================
   BLOCK-SPIELE (Kniffel-Familie)
   type:"block" · dice · rolls (Würfe pro Zug) · bonus {threshold, pts}
   fields [{id, name, sec:"upper"|"lower", kind, face?, n?, len?, pts?}]
     kind face      Summe der Augen einer Zahl
     kind kind      n Gleiche → pts oder Summe aller Würfel
     kind fullhouse Drilling + Paar → pts
     kind straight  len aufeinanderfolgende → pts
     kind chance    Summe aller Würfel
   ========================================================== */
TEMPLATES.kniffel={
  id:'kniffel', type:'block', name:'Kniffel', tagline:'Der Block-Klassiker: 5 Würfel, bis zu 3 Würfe, 13 Felder, Bonus ab 63.',
  dice:5, rolls:3, bonus:{threshold:63, pts:35},
  fields:[
    {id:'f1',name:'Einser',sec:'upper',kind:'face',face:1},
    {id:'f2',name:'Zweier',sec:'upper',kind:'face',face:2},
    {id:'f3',name:'Dreier',sec:'upper',kind:'face',face:3},
    {id:'f4',name:'Vierer',sec:'upper',kind:'face',face:4},
    {id:'f5',name:'Fünfer',sec:'upper',kind:'face',face:5},
    {id:'f6',name:'Sechser',sec:'upper',kind:'face',face:6},
    {id:'k3',name:'Dreierpasch',sec:'lower',kind:'kind',n:3},
    {id:'k4',name:'Viererpasch',sec:'lower',kind:'kind',n:4},
    {id:'fh',name:'Full House',sec:'lower',kind:'fullhouse',pts:25},
    {id:'ks',name:'Kleine Straße',sec:'lower',kind:'straight',len:4,pts:30},
    {id:'gs',name:'Große Straße',sec:'lower',kind:'straight',len:5,pts:40},
    {id:'kn',name:'Kniffel',sec:'lower',kind:'kind',n:5,pts:50},
    {id:'ch',name:'Chance',sec:'lower',kind:'chance'}
  ]
};
const isBlock=r=>r&&r.type==='block';
const sum=a=>a.reduce((x,y)=>x+y,0);
function fieldScore(fd,dice){
  const c=counts(dice);
  switch(fd.kind){
    case 'face': return c[fd.face]*fd.face;
    case 'kind': return c.some(n=>n>=fd.n)?(fd.pts??sum(dice)):0;
    case 'fullhouse': { const v=c.filter(n=>n>0).sort(); return v.length===2&&v[0]===2&&v[1]===3?fd.pts:0; }
    case 'straight': { let run=0,best=0; for(const f of FACES){ run=c[f]?run+1:0; best=Math.max(best,run); } return best>=fd.len?fd.pts:0; }
    case 'chance': return sum(dice);
    case 'sum': return sum(dice)===fd.n?fd.n:0;
  }
  return 0;
}
function sheetTotals(r,sheet){
  const up=sum(r.fields.filter(f=>f.sec==='upper').map(f=>sheet[f.id]||0));
  const low=sum(r.fields.filter(f=>f.sec==='lower').map(f=>sheet[f.id]||0));
  const bonus=r.bonus&&r.bonus.pts&&up>=r.bonus.threshold?r.bonus.pts:0;
  return {up,low,bonus,total:up+low+bonus};
}
const filled=(r,p)=>r.fields.filter(f=>p.sheet&&p.sheet[f.id]!=null).length;
function blockDice(){ const t=T(); return G.mode==='digital'?(t.roll||[]):t.sel; }
function fieldDesc(f){
  switch(f.kind){
    case 'face': return `Summe aller ${f.face}er`;
    case 'kind': return `${WORD[f.n]||f.n} Gleiche: ${f.pts!=null?fmt(f.pts)+' Punkte':'Summe aller Würfel'}`;
    case 'fullhouse': return `Drei Gleiche und zwei Gleiche: ${fmt(f.pts)} Punkte`;
    case 'straight': return `${f.len} aufeinanderfolgende Zahlen: ${fmt(f.pts)} Punkte`;
    case 'chance': return 'Summe aller Würfel';
    case 'sum': return `Augensumme genau ${f.n}: ${f.n} Punkte`;
  }
  return '';
}
function blockRulesList(r){
  const L=[`${r.dice} Würfel, bis zu ${r.rolls} ${r.rolls===1?'Wurf':'Würfe'} pro Zug. Zwischen den Würfen beliebige Würfel festhalten.`,
    r.ordered?'Die Felder werden der Reihe nach gespielt: In Runde 2 zählt nur eine 2, in Runde 3 nur eine 3 usw.':'Nach dem Zug genau ein Feld eintragen. Passt nichts, wird ein Feld mit 0 gestrichen.'];
  const up=r.fields.filter(f=>f.sec==='upper'), low=r.fields.filter(f=>f.sec==='lower');
  if(up.length) L.push(`Oben: ${up.map(f=>f.name).join(', ')} – jeweils die Summe dieser Zahl.${r.bonus&&r.bonus.pts?` Bonus +${fmt(r.bonus.pts)} ab ${fmt(r.bonus.threshold)} Punkten oben.`:''}`);
  low.forEach(f=>L.push(`${f.name}: ${fieldDesc(f)}.`));
  L.push('Das Spiel endet, wenn alle Felder gefüllt sind. Die höchste Summe gewinnt.');
  return L;
}
let showBlock=false;
const blockActs={
  broll(){ const t=T(), r=R(); if(t.rolls>=r.rolls) return;
    const prev=t.roll||[]; const held=t.held||[];
    const nr=Array.from({length:r.dice},(_,i)=>held[i]&&prev[i]?prev[i]:1+Math.floor(Math.random()*6));
    const s=ST(); const fresh=nr.filter((_,i)=>!(held[i]&&prev[i])); fresh.forEach(f=>s.faces[f]++); s.dice+=fresh.length; s.rolls++;
    t.roll=nr; t.rolls++; t.rollId=uid(); if(t.rolls>=r.rolls) t.held=[]; commit(); },
  bhold(i){ const t=T(); if(!t.roll||t.rolls>=R().rolls) return; i=+i; t.held=[...(t.held||[])]; t.held[i]=!t.held[i]; commit(); },
  bpick(id){
    const r=R(), p=G.players[G.cur], d=blockDice(); if(d.length!==r.dice) return;
    p.sheet=p.sheet||{}; if(p.sheet[id]!=null) return;
    if(r.ordered){ const nx=r.fields.find(f=>p.sheet[f.id]==null); if(!nx||nx.id!==id) return; }
    const fd=r.fields.find(f=>f.id===id); if(!fd) return;
    pushHist();
    const v=fieldScore(fd,d); const before=sheetTotals(r,p.sheet);
    p.sheet[id]=v; const after=sheetTotals(r,p.sheet); p.score=after.total;
    const ps=PS(p.id); ps.turns++; if(v===0) ps.niete++; ps.best=Math.max(ps.best,v);
    if(fd.kind==='kind'&&fd.n===r.dice&&v>0){ ps.trip++; celebrate('kniffel','Kniffel!',p.name); }
    addLog(v?`${esc(p.name)} trägt <b>${fmt(v)}</b> bei ${esc(fd.name)} ein.`:`${esc(p.name)} streicht ${esc(fd.name)}.`);
    if(!before.bonus&&after.bonus) addLog(`<b>${esc(p.name)} holt den Bonus (+${fmt(after.bonus)}).</b>`);
    if(G.players.every(pl=>filled(r,pl)===r.fields.length)){
      const w=[...G.players].sort((a,b)=>b.score-a.score)[0]; G.winner=w.id;
      addLog(`<b>${esc(w.name)} gewinnt mit ${fmt(w.score)} Punkten!</b>`);
    } else {
      do { G.cur=(G.cur+1)%G.players.length; } while(filled(r,G.players[G.cur])===r.fields.length);
      G.turn=freshTurn(r);
    }
    commit();
  },
  block(){ showBlock=true; renderOverlay(); },
  closeblock(){ showBlock=false; renderOverlay(); }
};

function blockFromRules(r,id,isCustom){
  const base=TEMPLATES.kniffel.fields;
  return {type:'block', id, isCustom, confirmDel:false, name:r.name, rolls:r.rolls||3,
    bonusOn:!!(r.bonus&&r.bonus.pts), bonusT:String(r.bonus?.threshold??63), bonusP:String(r.bonus?.pts??35),
    fields:base.map(b=>{ const f=(r.fields||[]).find(x=>x.id===b.id); return {id:b.id, on:!!f, pts:f&&f.pts!=null?String(f.pts):(b.pts!=null?String(b.pts):'')}; })};
}
function compileBlock(E){
  const errors=[]; const base=TEMPLATES.kniffel;
  const r={id:E.id, type:'block', name:E.name.trim()||'Eigenes Spiel', tagline:'', dice:base.dice, rolls:E.rolls, bonus:null, fields:[]};

TEMPLATES.schocken={
  id:'schocken', type:'round', name:'Schocken', tagline:'Kneipenklassiker: 3 Würfel, 13 Deckel, der schlechteste Wurf kassiert. Zwei Hälften und Finale.',

  if(c[1]===2){ const x=s[0]; return {cat:4,sub:x,label:`Schock ${x}`,deckel:x}; }
  if(s[0]===s[1]&&s[1]===s[2]) return {cat:3,sub:s[0],label:`General (${s.join('-')})`,deckel:3};
  if(s[0]-s[1]===1&&s[1]-s[2]===1) return {cat:2,sub:s[0],label:`Straße (${[...s].reverse().join('-')})`,deckel:2};

function roundActive(){ return G.players.map((p,i)=>i).filter(i=>{ const p=G.players[i]; return G.halfPlayers.includes(p.id) && (G.pool>0 || (p.deckel||0)>0); }); }

    addLog(`<span class="steal">${esc(B.name)} wirft Schock out!</span> ${esc(W.name)} kassiert alle Deckel.`); celebrate('schockout','Schock out!',B.name+' – '+W.name+' kassiert alle Deckel');

  rflip(){ const t=T(), r=R(); if(!r.flip||!t.roll||t.rolls>=roundMax()||t.flipRoll===t.rolls) return;

}

/* ==========================================================
   BLUFF (Mäxchen-Familie)
   type:"bluff" · lives (0 = keine Leben, nur Strafpunkte zählen)
   maexDouble   Zweifel an Mäxchen kostet doppelt
   equalAllowed Gleich hoch ansagen erlaubt
   blindPass    Glauben und ohne Würfeln höher weitergeben
   secondChance Nach dem Ansehen nochmal würfeln, dann unbesehen weitergeben
   maexBelieve  "match": wer Mäxchen glaubt, muss selbst Mäxchen ansagen
                "accept": wer Mäxchen glaubt, nimmt die Strafe sofort an
   hamburger    42 ist der höchste Wurf, noch über Mäxchen
   ========================================================== */
TEMPLATES.maexchen={
  id:'maexchen', type:'bluff', name:'Mäxchen', tagline:'Bluffen mit zwei Würfeln: verdeckt würfeln, ansagen, glauben oder aufdecken. Auch Mäxle oder Meiern genannt.',
  dice:2, lives:3, maexDouble:true, equalAllowed:false, blindPass:true, secondChance:false, maexBelieve:'match', hamburger:false
};
const isBluff=r=>r&&r.type==='bluff';
function bluffOrder(r){
  const o=[31,32,41,42,43,51,52,53,54,61,62,63,64,65,11,22,33,44,55,66,21];
  return r.hamburger?[...o.filter(v=>v!==42),42]:o;
}
const bVal=d=>{ const [a,b]=[...d].sort((x,y)=>y-x); return a*10+b; };
const bRank=(r,v)=>bluffOrder(r).indexOf(v);
function bLabel(r,v){
  if(v===21) return 'Mäxchen';
  if(r.hamburger&&v===42) return 'Hamburger';
  if(v%11===0) return `${v/11}er-Pasch`;
  return String(v);
}
const MAX=r=>bluffOrder(r)[bluffOrder(r).length-1];
function canBeat(r,claim){ return bRank(r,claim)<bluffOrder(r).length-1 || r.equalAllowed || (claim===21&&r.maexBelieve==='match'); }
function bluffRulesList(r){
  const L=['2 Würfel unter dem Becher. Die höhere Zahl zählt als Zehner: 6 und 3 = 63.',
    `Rangfolge: 31 < 32 < 41 … < 65 < Pasch (11 bis 66) < Mäxchen (21)${r.hamburger?' < Hamburger (42)':''}.`,
    'Würfeln, verdeckt ansehen und einen Wert ansagen – ehrlich oder geblufft. Er muss höher sein als die letzte Ansage'+(r.equalAllowed?' oder gleich hoch.':'.'),
    'Der Nächste glaubt (und würfelt selbst) oder deckt auf. Ist der Wurf mindestens so hoch wie angesagt, verliert der Aufdecker, sonst der Ansager.'];
  if(r.blindPass) L.push('Wer glaubt, darf auch ohne zu würfeln einen höheren Wert ansagen und weitergeben.');
  if(r.secondChance) L.push('Nach dem Ansehen darf man einmal nachwürfeln, muss das Ergebnis dann aber unbesehen weitergeben.');
  L.push(r.maexBelieve==='accept'?'Wird Mäxchen angesagt, deckt der Nächste auf oder nimmt die Strafe direkt an.':'Wird Mäxchen angesagt, deckt der Nächste auf oder muss selbst wieder Mäxchen ansagen.');
  if(r.maexDouble) L.push('Geht es um ein Mäxchen, kostet das Verlieren doppelt.');
  L.push(r.lives?`Jeder hat ${r.lives} ${r.lives===1?'Leben':'Leben'}. Wer keins mehr hat, scheidet aus. Der Letzte gewinnt.`:'Keine Leben: Es werden nur Strafpunkte gezählt, Spielende nach Absprache.');
  L.push('Wer eine Runde verliert, fängt die nächste an.');
  return L;
}
function bluffAlive(){ return G.players.map((p,i)=>i).filter(i=>!R().lives||G.players[i].lives>0); }
function bluffNextAlive(i){ const al=bluffAlive(); for(let k=1;k<=G.players.length;k++){ const j=(i+k)%G.players.length; if(al.includes(j)) return j; } return i; }
function bluffPenalty(idx,amt,why){
  const r=R(), p=G.players[idx];
  p.pen=(p.pen||0)+amt; if(r.lives) p.lives=Math.max(0,p.lives-amt);
  PS(p.id).niete+=amt;
  addLog(`<span class="steal">${esc(p.name)} verliert ${amt===2?'doppelt':'ein Leben'}</span>${why?' – '+why:''}${r.lives?` (noch ${p.lives})`:''}.`);
  if(r.lives && p.lives===0){ addLog(`${esc(p.name)} scheidet aus.`); PS(p.id).burned++; }
  const al=bluffAlive();
  if(r.lives && al.length<=1){ G.winner=G.players[al[0]].id; addLog(`<b>${esc(G.players[al[0]].name)} gewinnt Mäxchen!</b>`); return; }
  G.cur = (!r.lives||p.lives>0)?idx:bluffNextAlive(idx);
  G.bluff.last=null; G.turn=freshTurn(r);
}
let peek=false, peekKey='';
function myPid(){ return G&&G.code?(prefs.me||{})[G.code]:null; }
function canActBluff(){ const me=myPid(); return !G.code || !me || me==='*' || me===G.players[G.cur].id; }
const bluffActs={
  xroll(){ const t=T(); if(t.dice&&!t.again) return; const s=ST();
    const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]; d.forEach(f=>s.faces[f]++); s.dice+=2; s.rolls++;
    t.dice=d; t.blind=false; t.rollId=uid(); peek=false; commit(); },
  xagain(){ const t=T(); if(!R().secondChance||!t.dice||t.blind) return; const s=ST();
    const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]; d.forEach(f=>s.faces[f]++); s.dice+=2; s.rolls++;
    t.dice=d; t.blind=true; peek=false; addLog(`${esc(G.players[G.cur].name)} würfelt nach und gibt unbesehen weiter.`); commit(); },
  xpeek(){ if(T().blind) return; peek=!peek; render(); },
  xbelieve(){ const r=R(), b=G.bluff; if(!b.last) return; pushHist();
    const prev=G.players.find(p=>p.id===b.last.pid);
    if(b.last.claim===21 && r.maexBelieve==='accept'){ addLog(`${esc(G.players[G.cur].name)} glaubt das Mäxchen.`); bluffPenalty(G.cur, r.maexDouble?2:1, 'Mäxchen geglaubt'); commit(); return; }
    if(bRank(r,bVal(b.last.dice))<bRank(r,b.last.claim)) PS(prev.id).trip++;
    addLog(`${esc(G.players[G.cur].name)} glaubt ${esc(prev.name)}.`);
    T().believed=true; commit(); },
  xblind(){ const r=R(), b=G.bluff, t=T(); if(!r.blindPass||!b.last||t.dice) return;
    t.dice=[...b.last.dice]; t.blind=true; t.passed=true; peek=false;
    if(bRank(r,bVal(b.last.dice))<bRank(r,b.last.claim)) PS(b.last.pid).trip++;
    commit(); },
  xdoubt(){ const r=R(), b=G.bluff; if(!b.last) return; pushHist();
    const prevIdx=G.players.findIndex(p=>p.id===b.last.pid), me=G.cur;
    const actual=bVal(b.last.dice), claim=b.last.claim;
    const honest=bRank(r,actual)>=bRank(r,claim);
    const amt=(claim===21||actual===21)&&r.maexDouble?2:1;
    G.bluff.reveal={dice:b.last.dice, claim, by:G.players[me].id, of:b.last.pid, honest};
    addLog(`${esc(G.players[me].name)} deckt auf: ${esc(bLabel(r,actual))} statt ${esc(bLabel(r,claim))} angesagt.`);
    if(!honest){ PS(G.players[me].id).stole++; celebrate('caught','Erwischt!',G.players[prevIdx].name+' hat geblufft'); }
    bluffPenalty(honest?me:prevIdx, amt, honest?'die Ansage stimmte':'beim Bluffen erwischt');
    commit(); },
  xclaim(v){ v=+v; const r=R(), b=G.bluff, t=T(); if(!t.dice) return;
    const min=b.last?b.last.claim:null;
    if(min!=null){ const ok=bRank(r,v)>bRank(r,min) || (bRank(r,v)===bRank(r,min)&&(r.equalAllowed||(min===21&&r.maexBelieve==='match'))); if(!ok) return; }
    pushHist();
    const p=G.players[G.cur]; PS(p.id).turns++;
    b.last={pid:p.id, claim:v, dice:[...t.dice]}; G.bluff.reveal=null;
    addLog(`${esc(p.name)} sagt <b>${esc(bLabel(r,v))}</b> an${t.passed?' (ohne zu würfeln)':''}.`);
    G.cur=bluffNextAlive(G.cur); G.turn=freshTurn(r); peek=false; commit(); },
  xlose(i){ const r=R(); pushHist(); const [idx,amt]=String(i).split(':').map(Number); bluffPenalty(idx,amt,''); commit(); },
  xme(pid){ prefs.me={...(prefs.me||{}),[G.code]:pid}; savePrefs(); render(); }
};
function cupHTML(){ return `<div class="cup" aria-hidden="true"><svg viewBox="0 0 120 110"><path d="M22 10 H98 L88 100 H32 Z" fill="var(--ink)"/><rect x="16" y="4" width="88" height="12" rx="4" fill="var(--ink)"/><path d="M36 30 H84" stroke="var(--paper)" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/></svg></div>`; }
function claimGrid(r,min){
  const ord=bluffOrder(r); const mi=min==null?-1:bRank(r,min);
  return `<div class="claims">${ord.map(v=>{ const k=bRank(r,v);
    const ok=min==null||k>mi||(k===mi&&(r.equalAllowed||(min===21&&r.maexBelieve==='match')));
    return `<button class="claim ${v===21||(r.hamburger&&v===42)?'top':v%11===0?'pasch':''}" data-act="xclaim" data-v="${v}" ${ok?'':'disabled'}>${v}</button>`; }).join('')}</div>
    <p class="muted small" style="margin:0">Gelb = Pasch, rot = ${r.hamburger?'Mäxchen (21) und Hamburger (42)':'Mäxchen (21)'}.</p>`;
}

function bluffGameHTML(){

      <details><summary class="muted" style="cursor:pointer;font-size:14px">Rangfolge zum Nachschauen</summary><div class="ranks">${[...bluffOrder(r)].reverse().map(v=>`<span>${esc(bLabel(r,v))}</span>`).join('')}</div></details>`;

function canClose(open,target,start=0){ if(target===0) return true; for(let i=start;i<open.length;i++){ if(open[i]<=target && canClose(open,target-open[i],i+1)) return true; } return false; }

function boxEndTurn(score){
  const r=R(), p=G.players[G.cur]; p.total=(p.total||0)+score; p.score=p.total;
  const ps=PS(p.id); ps.turns++; if(score===0) ps.trip++; ps.best=Math.max(ps.best,score);
  if(G.cur===G.players.length-1){
    if(G.box.round>=r.rounds){ const w=[...G.players].sort((a,b)=>a.total-b.total)[0]; G.winner=w.id; addLog(`<b>${esc(w.name)} gewinnt mit ${w.total} Punkten Rest!</b>`); return; }
    G.box.round++; addLog(`Runde ${G.box.round} beginnt.`);
  }

}
const boxActs={
  boxroll(){ const t=T(), r=R(); if(t.dice) return; const n=boxNeedOne(r,t)?1:2;
    t.dice=Array.from({length:n},()=>1+Math.floor(Math.random()*6)); t.rollId=uid(); t.tsel=[];
    const s=ST(); t.dice.forEach(f=>s.faces[f]++); s.dice+=n; s.rolls++; commit(); },
  boxtile(n){ n=+n; const t=T(); if(!t.tiles[n-1]) return; t.tsel=t.tsel.includes(n)?t.tsel.filter(x=>x!==n):[...t.tsel,n]; commit(); },
  boxshut(){ const t=T(), r=R(), d=boxDice(); if(!d) return; const s=sum(d);
    if(sum(t.tsel)!==s) return; pushHist();
    t.tsel.forEach(n=>t.tiles[n-1]=false); t.tsel=[]; t.dice=null; t.sel=[]; t.left=boxNeedOne(r,t)?1:2;
    if(t.tiles.every(x=>!x)){ const p=G.players[G.cur]; addLog(`<b>${esc(p.name)} schließt die Box!</b>`); celebrate('shut','Shut the Box!',p.name);

/* ---------- gemeinsame Helfer für alle Spieltypen ---------- */
function rankOrder(r){
  const P=[...G.players];
  if(isBluff(r)) return P.sort((a,b)=>r.lives?b.lives-a.lives:(a.pen||0)-(b.pen||0));
  if(isRound(r)) return P.sort((a,b)=>(a.deckel||0)-(b.deckel||0));
  if(isBox(r)) return P.sort((a,b)=>(a.total||0)-(b.total||0));
  if(isHouse(r)||isRP(r)) return P.sort((a,b)=>(b.wins||0)-(a.wins||0));
  if(isRace(r)) return P.sort((a,b)=>(b.pos||0)-(a.pos||0));
  return P.sort((a,b)=>b.score-a.score);
}
function scoreLabel(r,p){
  if(isBluff(r)) return r.lives?p.lives+' Leben':(p.pen||0)+' Strafp.';
  if(isRound(r)) return (p.deckel||0)+' Deckel';
  if(isBox(r)) return (p.total||0)+' Rest';
  if(isHouse(r)||isRP(r)) return (p.wins||0)+' Siege';
  if(isRace(r)) return (p.pos||0)+' von '+raceSeq(r).length;
  return fmt(p.score);
}
function scoreBig(r,p){
  if(isBluff(r)) return r.lives?p.lives:(p.pen||0);
  if(isRound(r)) return p.deckel||0;
  if(isBox(r)) return p.total||0;
  if(isHouse(r)||isRP(r)) return p.wins||0;
  if(isRace(r)) return (p.pos||0)+'/'+raceSeq(r).length;
  return fmt(p.score);
}

/* ==========================================================
   TON, VIBRATION, SCHÜTTELN, BILDSCHIRM AN
   ========================================================== */
let actx=null;
function audio(){ try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; actx=new C(); } if(actx.state==='suspended') actx.resume(); return actx; }catch(e){ return null; } }
function noiseBurst(c,t0,dur,freq,gain){
  const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=3;
  const g=c.createGain(); g.gain.value=gain; src.connect(f); f.connect(g); g.connect(c.destination); src.start(t0);
}
function tone(c,t0,freq,dur,gain,type='triangle'){
  const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+.02);
}
function sfx(kind){
  if(prefs.sound===false) return; const c=audio(); if(!c) return; const t=c.currentTime;
  if(kind==='roll'){ for(let i=0;i<7;i++) noiseBurst(c,t+i*0.045+Math.random()*0.02,0.05,1800+Math.random()*2200,0.5); }
  else if(kind==='win'){ [523,659,784,1047].forEach((f,i)=>tone(c,t+i*0.11,f,0.35,0.18)); }
  else if(kind==='bad'){ [330,262,196].forEach((f,i)=>tone(c,t+i*0.12,f,0.3,0.16,'sawtooth')); }
  else if(kind==='good'){ [660,880].forEach((f,i)=>tone(c,t+i*0.09,f,0.25,0.16)); }
  else if(kind==='tick'){ tone(c,t,1200,0.05,0.08,'square'); }
}
function buzz(p){ if(prefs.vibrate===false) return; try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
const ROLL_ACTS=['roll','broll','rroll','xroll','xagain','boxroll','hroll','bustroll','shiproll','pokroll','jroll'];
/* Schütteln */
let lastShake=0, shakeOn=false;
function onMotion(e){
  const a=e.acceleration&&e.acceleration.x!=null?e.acceleration:e.accelerationIncludingGravity; if(!a) return;
  const m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2); const thr=e.acceleration&&e.acceleration.x!=null?16:28;
  const now=Date.now(); if(m<thr||now-lastShake<1200) return;
  if(view!=='game'||!G||G.winner||(panel&&panel!=='table')||showStats||showBlock) return;
  const sel=['roll','broll','rroll','xroll','boxroll','hroll','bustroll','shiproll','pokroll','jroll'].map(a=>`[data-act=${a}]:not([disabled])`).join(',')+',[data-act=cont]:not([disabled])';
  const b=document.querySelector('#app '+sel.split(',').join(',#app ')); if(!b) return;
  lastShake=now; b.click();
}
function shakeListen(){ const want=!!prefs.shake; if(want&&!shakeOn){ window.addEventListener('devicemotion',onMotion); shakeOn=true; } if(!want&&shakeOn){ window.removeEventListener('devicemotion',onMotion); shakeOn=false; } }
/* Bildschirm an */
let wake=null;
async function keepAwake(){
  const want=view==='game'&&G&&!G.winner&&prefs.awake!==false&&document.visibilityState==='visible';
  try{
    if(want&&!wake&&navigator.wakeLock){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); }
    if(!want&&wake){ await wake.release(); wake=null; }

/* ---------- Rundensiege (gemeinsam für 21/15, Kapitän, Poker) ---------- */
function rpFinish(score,label){
  const r=R(), p=G.players[G.cur]; G.rp.res[p.id]={s:score,label}; PS(p.id).turns++; if(score>PS(p.id).best) PS(p.id).best=score;
  addLog(`${esc(p.name)}: ${label}.`);
  if(G.players.every(pl=>G.rp.res[pl.id])){
    const vals=G.players.map(pl=>G.rp.res[pl.id].s); const best=Math.max(...vals);
    if(best<0) addLog('Alle drüber – niemand gewinnt die Runde.');
    else { const ws=G.players.filter(pl=>G.rp.res[pl.id].s===best); ws.forEach(pl=>{ pl.wins=(pl.wins||0)+1; pl.score=pl.wins; PS(pl.id).trip++; });
      addLog(`Runde an ${ws.map(pl=>esc(pl.name)).join(' und ')}${ws.length>1?' (Gleichstand)':''}.`); }
    G.rp.last=G.rp.res; G.rp.res={};
    const top=[...G.players].sort((a,b)=>(b.wins||0)-(a.wins||0));
    if((top[0].wins||0)>=r.wins&&(top.length<2||(top[0].wins||0)>(top[1].wins||0))){ G.winner=top[0].id; addLog(`<b>${esc(top[0].name)} gewinnt ${esc(r.name)}!</b>`); return; }
    G.rp.starter=((G.rp.starter||0)+1)%G.players.length; G.cur=G.rp.starter;
  } else G.cur=(G.cur+1)%G.players.length;
  G.turn=freshTurn(r);
}
function rpBoard(r,sub){
  return `<section class="card" style="padding:8px"><div class="top" style="padding:4px 10px 6px"><span class="label">Rundensiege · Ziel ${r.wins}</span><span class="muted small">${sub||''}</span></div>
    <div class="board">${G.players.map((pl,i)=>{ const cur=G.rp.res[pl.id], last=(G.rp.last||{})[pl.id];
      return `<div class="prow ${i===G.cur&&!G.winner?'cur':''}"><span class="rank"></span><div style="min-width:0"><div class="nm">${esc(pl.name)}</div><div class="muted small">${cur?'diese Runde: '+esc(cur.label):last?'letzte Runde: '+esc(last.label):'noch nicht dran'}</div></div><span class="sc">${pl.wins||0}</span></div>`; }).join('')}</div></section>`;
}

  `Die höchste Ladung gewinnt die Runde. Wer zuerst ${r.wins} Runden gewinnt, gewinnt das Spiel.`]; }
const SHIPN={6:'Schiff',5:'Kapitän',4:'Mannschaft'};
function shipTake(t,dice){ const rest=[...dice]; for(const need of [6,5,4]){ if(t.set.includes(need)) continue; const i=rest.indexOf(need); if(i<0) break; t.set.push(need); rest.splice(i,1); } return rest; }
function shipEval(dice){ const t={set:[]}; const rest=shipTake(t,dice); return t.set.length===3?{ok:true,cargo:sum(rest)}:{ok:false,cargo:0}; }
const shipActs={
  shiproll(){ const t=T(), r=R(); if(t.rolls>=r.rolls) return; pushHist();
    const crewDone=t.set.length===3; const n=crewDone?2:5-t.set.length; const d=Array.from({length:n},rnd); statRoll(d); t.rolls++; t.rollId=uid(); t.last=d;
    if(crewDone) t.cargo=d; else { const before=t.set.length; const rest=shipTake(t,d); if(t.set.length===3) t.cargo=rest; if(t.set.length>before) sfx('good'); }
    if(t.rolls>=r.rolls) return shipEnd();
    commit(); },
  shipkeep(){ pushHist(); shipEnd(); },
  shipreal(){ const t=T(); if(t.sel.length!==5) return; pushHist(); const e=shipEval(t.sel); const p=G.players[G.cur];
    if(e.ok&&e.cargo>=11) celebrate('good','Volle Ladung!',`${p.name}: ${e.cargo}`);
    rpFinish(e.ok?e.cargo:0, e.ok?`Ladung ${e.cargo}`:'keine Mannschaft'); commit(); }
};
function shipEnd(){ const t=T(), p=G.players[G.cur]; const ok=t.set.length===3; const c=ok?sum(t.cargo||[]):0;
  if(!ok) PS(p.id).niete++; if(ok&&c>=11) celebrate('good','Volle Ladung!',`${p.name}: ${c}`);
  rpFinish(c, ok?`Ladung ${c}`:'keine Mannschaft'); commit(); }

      <div class="tally"><span class="muted">${e?(e.ok?'Mannschaft komplett':'keine Mannschaft'):'Noch nicht alle 5 Würfel'}</span><span class="num">${e?(e.ok?'Ladung '+e.cargo:'0'):''}</span></div>
      <button class="btn primary big" data-act="shipreal" ${e?'':'disabled'}>Eintragen</button>`;

      ${left>0?`<button class="btn primary big" data-act="shiproll">${!t.rolls?'5 Würfel werfen':crew?'Ladung neu würfeln':'Weiterwürfeln mit '+(5-t.set.length)+' Würfeln'} <span class="btnsub">${left} ${left===1?'Wurf':'Würfe'} übrig</span></button>`:''}

}

/* ---------- Würfelpoker ---------- */
const PNAME=['Nichts','Paar','Zwei Paare','Drilling','Straße','Full House','Vierling','Fünfling'];
function pokerHand(d){
  const c=counts(d); const groups=FACES.map(f=>[c[f],f]).filter(g=>g[0]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const shape=groups.map(g=>g[0]).join(''); const s=[...d].sort((a,b)=>a-b).join('');
  let cat=0;
  if(shape==='5') cat=7; else if(shape==='41') cat=6; else if(shape==='32') cat=5; else if(s==='12345'||s==='23456') cat=4;
  else if(shape==='311') cat=3; else if(shape==='221') cat=2; else if(shape==='2111') cat=1;
  let tb=0; groups.forEach(g=>{ for(let i=0;i<g[0];i++) tb=tb*7+g[1]; });
  const what=cat===4?`Straße ${s[0]}–${s[4]}`:cat===0?'Nichts, höchste '+groups[0][1]:`${PNAME[cat]} (${groups.filter(g=>g[0]>=2).map(g=>g[1]+'er').join(' + ')})`;
  return {cat, score:cat*1e5+tb, label:what};
}
function pokerRulesList(r){ return [`5 Würfel, bis zu ${r.rolls} Würfe. Zwischen den Würfen beliebige Würfel festhalten.`,
  'Rangfolge: Fünfling > Vierling > Full House > Straße (1–5 oder 2–6) > Drilling > Zwei Paare > Paar > Nichts.',
  'Gleiche Hand: Die höheren Augen gewinnen, z. B. 6er-Paar schlägt 5er-Paar.',
  `Die beste Hand gewinnt die Runde. Wer zuerst ${r.wins} Runden gewinnt, gewinnt das Spiel.`]; }
const pokerActs={
  pokroll(){ const t=T(), r=R(); if(t.rolls>=r.rolls) return; const prev=t.dice||[]; const held=t.held||[];
    t.dice=Array.from({length:5},(_,i)=>held[i]&&prev[i]?prev[i]:rnd()); statRoll(t.dice.filter((_,i)=>!(held[i]&&prev[i]))); t.rolls++; t.rollId=uid(); if(t.rolls>=r.rolls) t.held=[]; commit(); },
  pokhold(i){ const t=T(); if(!t.dice||t.rolls>=R().rolls) return; i=+i; t.held=[...(t.held||[])]; t.held[i]=!t.held[i]; commit(); },
  pokdone(){ const t=T(); const d=G.mode==='digital'?t.dice:(t.sel.length===5?t.sel:null); if(!d) return; pushHist(); const h=pokerHand(d); const p=G.players[G.cur];
    if(h.cat>=6) celebrate('kniffel',PNAME[h.cat]+'!',p.name);
    rpFinish(h.score,h.label); commit(); }
};
function pokerGameHTML(){
  const r=R(), t=T(), p=G.players[G.cur]; const left=r.rolls-t.rolls;
  const d=G.mode==='digital'?t.dice:(t.sel.length===5?t.sel:null); const h=d?pokerHand(d):null;
  let body='';
  if(G.mode==='real') body=`<div class="dice">${t.sel.map((f,i)=>dieHTML(f,{tag:'button',attrs:`data-act="unsel" data-v="${i}"`})).join('')}${'<div class="die ghost"></div>'.repeat(Math.max(0,5-t.sel.length))}</div>
      ${padHTML('face',t.sel.length>=5)}<p class="muted small" style="margin:0">Am Tisch bis zu ${r.rolls}× würfeln, dann die 5 Würfel eintippen.</p>`;
  else body=`${t.dice?`<div class="dice rolled" data-roll="${t.rollId}">${t.dice.map((f,i)=>dieHTML(f,{tag:'button',cls:(t.held||[])[i]?'picked':'',attrs:`data-act="pokhold" data-v="${i}" aria-pressed="${!!(t.held||[])[i]}" ${left<=0?'disabled':''}`})).join('')}</div>
      <p class="muted small" style="margin:0">${left>0?'Würfel antippen zum Festhalten.':'Keine Würfe mehr.'}</p>`:''}
      ${left>0?`<button class="btn ${t.dice?'':'primary'} big" data-act="pokroll">${t.rolls?`Nochmal würfeln (${left} übrig)`:'5 Würfel werfen'}</button>`:''}`;
  return `${gameTop(5)}${rpBoard(r,'beste Hand gewinnt')}
  <section class="card turn">
    <div class="turnhead"><div><div class="label">Am Zug</div><h2>${esc(p.name)}</h2></div>${G.mode==='digital'?`<div class="stat"><div class="label">Wurf</div><div class="big num">${t.rolls}<span style="font-size:24px">/${r.rolls}</span></div></div>`:''}</div>
    ${segHTML()}${body}
    <div class="tally"><span class="muted">Hand</span><span class="num" style="font-size:22px">${h?esc(h.label):'–'}</span></div>
    <button class="btn primary big" data-act="pokdone" ${h?'':'disabled'}>Hand zeigen</button>
  </section>${gameFooter()}`;
}

/* ---------- Jule (Würfelrennen) ---------- */
const raceSeq=r=>r.back?[1,2,3,4,5,6,6,5,4,3,2,1]:[1,2,3,4,5,6];
function raceRulesList(r){ return ['Ein Würfel. Jeder braucht der Reihe nach die Zahlen '+raceSeq(r).join(' – ')+'.',
  'Würfelst du die Zahl, die du gerade brauchst, wird sie abgehakt'+(r.again?' und du darfst gleich nochmal.':'.'),
  'Passt der Wurf nicht, ist der Nächste dran.',
  'Wer zuerst die ganze Reihe geschafft hat, gewinnt.']; }
function raceThrow(d){ const r=R(), p=G.players[G.cur], seq=raceSeq(r); pushHist(); p.pos=p.pos||0; const need=seq[p.pos]; const hit=d===need;
  G.raceLast={pid:p.id,die:d,hit,need}; PS(p.id).turns++;
  if(hit){ p.pos++; p.score=p.pos; PS(p.id).trip++; if(p.pos>=seq.length){ G.winner=p.id; addLog(`<b>${esc(p.name)} ist als Erste:r durch!</b>`); commit(); return; }
    addLog(`${esc(p.name)} würfelt die ${d} – abgehakt.`); if(!r.again) G.cur=(G.cur+1)%G.players.length; }
  else { addLog(`${esc(p.name)} würfelt ${d}, braucht ${need}.`); G.cur=(G.cur+1)%G.players.length; }
  G.turn=freshTurn(r); commit(); }
const raceActs={ jroll(){ const d=rnd(); statRoll([d]); raceThrow(d); }, jface(f){ raceThrow(+f); } };
function raceGameHTML(){
  const r=R(), p=G.players[G.cur], seq=raceSeq(r), L=G.raceLast;
  const need=seq[p.pos||0];
  const board=`<section class="card" style="padding:10px 12px;display:flex;flex-direction:column;gap:10px">${G.players.map((pl,i)=>`<div class="racerow ${i===G.cur&&!G.winner?'cur':''}"><b>${esc(pl.name)}</b><div class="seqs">${seq.map((n,k)=>`<span class="sq ${k<(pl.pos||0)?'ok':k===(pl.pos||0)?'next':''}">${n}</span>`).join('')}</div></div>`).join('')}</section>`;
  return `${gameTop(1)}${board}
  <section class="card turn">
    <div class="turnhead"><div><div class="label">Am Zug</div><h2>${esc(p.name)}</h2></div><div class="stat"><div class="label">Braucht</div><div class="big num">${need}</div></div></div>
    ${segHTML()}
    ${L?`<div class="hint ${L.hit?'good':'zone'}"><div class="dice" style="min-height:0;margin-bottom:6px">${dieHTML(L.die)}</div>${esc((G.players.find(x=>x.id===L.pid)||{}).name||'')} ${L.hit?'hat die '+L.die+' abgehakt.':'brauchte '+L.need+' – daneben.'}</div>`:''}
    ${G.mode==='real'?`${padHTML('jface')}<p class="muted small" style="margin:0">Am Tisch würfeln und die Zahl antippen.</p>`:`<button class="btn primary big" data-act="jroll">Würfeln</button>`}
  </section>${gameFooter()}`;
}

/* ---------- Editoren der neuen Typen ---------- */
function simpleFromRules(r,id,isCustom){ return {type:r.type, id, isCustom, confirmDel:false, name:r.name, target:r.target||21, wins:r.wins||3, rolls:r.rolls||3, again:r.again!==false, back:r.back!==false}; }
function compileSimple(E){ const errors=[]; if(!E.name.trim()) errors.push('Gib dem Spiel einen Namen.');
  const r={id:E.id, type:E.type, name:E.name.trim()||'Eigenes Spiel'};

function metaOf(r){
  if(isBlock(r)) return `${r.dice} Würfel · ${r.rolls} ${r.rolls===1?'Wurf':'Würfe'} · ${r.fields.length} Felder`;
  if(isRound(r)) return `${r.dice} Würfel · ${r.deckel} Deckel`;
  if(isBluff(r)) return `2 Würfel · Bluffen · ${r.lives?r.lives+' Leben':'Strafpunkte'}`;
  if(isBox(r)) return `${r.tiles} Klappen · ${r.rounds} Runden · wenig gewinnt`;
  if(isHouse(r)) return `1 Würfel · 3 Stellen · ${r.target} Rundensiege`;
  if(isBust(r)) return `1 Würfel · Ziel ${r.target} · ${r.wins} Rundensiege`;
  if(isShip(r)) return `5 Würfel · ${r.rolls} Würfe · ${r.wins} Rundensiege`;
  if(isPoker(r)) return `5 Würfel · ${r.rolls} Würfe · ${r.wins} Rundensiege`;
  if(isRace(r)) return `1 Würfel · ${r.back?'1–6 und zurück':'1–6'} · Wettrennen`;
  return `${r.dice} Würfel · Ziel ${r.exact?'genau ':''}${fmt(r.target)}`;
}

function gameHTML(){
  if(isBlock(R())) return blockGameHTML();
  if(isRound(R())) return roundGameHTML();
  if(isBluff(R())) return bluffGameHTML();
  if(isBox(R())) return boxGameHTML();
  if(isHouse(R())) return houseGameHTML();
  if(isBust(R())) return bustGameHTML();
  if(isShip(R())) return shipGameHTML();
  if(isPoker(R())) return pokerGameHTML();
  if(isRace(R())) return raceGameHTML();
  const rs=R(), t=T(), p=G.players[G.cur];
  const order=G.players.map((pl,i)=>({...pl,i})).sort((a,b)=>b.score-a.score);
  const rank={}; order.forEach((pl,k)=>rank[pl.i]=k+1);
  const faces=selFaces(); const sc=faces.length?scoreFaces(rs,faces):{pts:0,ok:true};

  let input='';
  if(G.mode==='real'){
    const ghosts=Math.max(0,t.left-t.sel.length);
    input=`<div><div class="label" style="margin-bottom:6px">Rausgelegte Würfel dieses Wurfs</div>
      <div class="dice">${t.sel.map((f,i)=>dieHTML(f,{tag:'button',cls:sc.ok?'':'bad',attrs:`data-act="unsel" data-v="${i}" title="Antippen zum Entfernen"`})).join('')}${'<div class="die ghost"></div>'.repeat(ghosts)}</div></div>
      <div class="pad">${FACES.map(f=>dieHTML(f,{tag:'button',attrs:`data-act="face" data-v="${f}" ${t.sel.length>=t.left?'disabled':''}`})).join('')}</div>
      <p class="muted" style="margin:0;font-size:13px">Am Tisch würfeln, dann die Würfel antippen, die rausgelegt werden. Antippen oben entfernt sie wieder.</p>`;
  } else {
    if(!t.roll){
      input=`<button class="btn primary" data-act="roll" style="padding:18px;font-size:17px">${t.left} Würfel werfen</button>`;
    } else {
      const niete=!canScore(rs,t.roll);
      input=`<div class="dice rolled" data-roll="${t.rollId||''}">${t.roll.map((f,i)=>dieHTML(f,{tag:'button',cls:(t.picked.includes(i)?'picked':'')+(t.picked.includes(i)&&!sc.ok?' bad':''),attrs:rs.forceTake?'tabindex="-1" style="cursor:default"':`data-act="pick" data-v="${i}" aria-pressed="${t.picked.includes(i)}"`})).join('')}</div>
      ${niete?`<div class="hint warn"><b>Niete!</b> Kein Würfel zählt.</div>`:`<p class="muted" style="margin:0;font-size:13px">${rs.forceTake?'Alle Punktewürfel werden genommen, wie sie fallen.':'Alle Punktewürfel sind vorausgewählt. Antippen zum Abwählen.'}</p>`}`;
    }
  }
  const selInvalid=faces.length&&!sc.ok;
  const leftRaw=t.left-faces.length;
  const canCont=faces.length>0&&sc.ok&&(leftRaw>0||rs.carryOver);
  const canStop=sc.ok&&((t.pts+sc.pts)>0||sc.win)&&!(G.mode==='digital'&&t.roll&&!faces.length&&!canScore(rs,t.roll));
  const leftAfter=leftRaw===0?rs.dice:leftRaw;

  return `
  ${gameTop(5)}

  <section class="card" style="padding:8px">
    <div class="board">${G.players.map((pl,i)=>{const zz=zoneOf(rs,pl.score);return `
      <div class="prow ${i===G.cur?'cur':''}"><span class="rank">${rank[i]}.</span>
        <div style="min-width:0"><div class="nm">${esc(pl.name)}${zz?`<span class="tag">Sperrzone</span>`:''}</div>${trackHTML(rs,pl.score)}</div>
        <span class="sc">${fmt(pl.score)}</span></div>`}).join('')}</div>
  </section>

  <section class="card turn">
    <div class="turnhead">
      <div><div class="label">Am Zug</div><h2>${esc(p.name)}</h2><div class="muted num" style="font-size:18px">Stand ${fmt(p.score)}</div></div>
      <div class="stat"><div class="label">Zug</div><div class="big num">${fmt(t.pts+(sc.ok?sc.pts:0))}</div><div class="muted" style="font-size:13px">${t.left} Würfel im Spiel</div></div>
    </div>
    <div class="seg" role="group" aria-label="Würfel">
      <button data-act="mode" data-v="real" aria-pressed="${G.mode==='real'}">Echte Würfel</button>
      <button data-act="mode" data-v="digital" aria-pressed="${G.mode==='digital'}">Digitale Würfel</button>
    </div>
    ${input}
    <div class="tally"><span class="muted">${faces.length?`Rausgelegt: ${faces.length} Würfel`:'Noch nichts rausgelegt'}</span>
      <span>${selInvalid?'<span class="err">Nicht jeder Würfel zählt</span>':`<span class="num">+${fmt(sc.pts)}</span>`}</span></div>
    <div class="actions">
      <button class="btn primary" data-act="cont" ${canCont?'':'disabled'}>Weiterwürfeln<span class="btnsub">${canCont?'mit '+leftAfter+(leftAfter===1?' Würfel':' Würfeln'):'erst Würfel rauslegen'}</span></button>
      <button class="btn" data-act="stop" ${canStop?'':'disabled'}>Aufhören<span class="btnsub">und schreiben</span></button>
      <button class="btn red wide" data-act="niete">Niete${t.pts?` – ${fmt(t.pts)} Punkte weg`:''}</button>
    </div>
  </section>

  ${gameFooter()}`;
}
function gameTop(face){
  return `<div class="top"><div class="brand">${dieHTML(face,{attrs:'style="width:34px;height:34px;padding:4px"'})}<h1 class="${R().name.length>13?'long':''}">${esc(R().name)}</h1></div>
    <div class="topright"><span class="chip" id="topchip"></span><button class="btn small" data-act="panel" data-v="menu" aria-label="Menü öffnen">Menü</button></div></div>`;
}
function gameFooter(){
  return `<section class="card">
    <div class="top" style="margin-bottom:8px"><div class="label">Zuletzt</div><button class="btn small" data-act="undo" ${(G.hist||[]).length?'':'disabled'}>Rückgängig</button></div>
    <ol class="log">${G.log.slice(0,3).map(l=>`<li><span class="num">${l.n}</span><span>${l.t}</span></li>`).join('')}</ol>
  </section>`;
}
